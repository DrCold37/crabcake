<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Tuner — Community Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1d36;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden}
#top{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:#1a2a44;border-bottom:1px solid #2a3a5a}
.cb{padding:5px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:11px;cursor:pointer}
.cb:hover{background:rgba(255,255,255,.12)}
.cb.on{border-color:#FFD93D;background:rgba(255,217,61,.15);color:#FFD93D}
#canvas-wrap{position:relative;width:100%;height:calc(100vh - 200px);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab}
#panel{display:flex;gap:20px;padding:10px 16px;background:#1a2a44;flex-wrap:wrap;align-items:center;border-top:2px solid #2a3a5a}
.sg{display:flex;flex-direction:column;gap:2px}
.sg label{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px}
.sg .row{display:flex;align-items:center;gap:6px}
.sg input[type=range]{width:130px;accent-color:#00C9B1}
.sg .v{font-size:12px;font-weight:700;color:#00C9B1;min-width:45px}
#expBtn{margin-left:auto;padding:8px 20px;border-radius:20px;border:none;background:linear-gradient(135deg,#00C9B1,#00a896);color:#fff;font-weight:700;cursor:pointer;font-size:13px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
#modal.show{display:flex}
#mbox{background:#1a2a44;border:2px solid #00C9B1;border-radius:12px;padding:20px;max-width:600px;width:90%}
#mbox textarea{width:100%;height:180px;background:#0f1d36;color:#00C9B1;border:1px solid #2a3a5a;border-radius:8px;padding:10px;font-family:monospace;font-size:11px}
#mbox button{margin-top:8px;padding:6px 14px;border-radius:10px;border:none;color:#fff;cursor:pointer;font-weight:700}
#status{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:8px;font-size:11px;z-index:5;pointer-events:none}
</style>
</head><body>

<div id="top"></div>
<div id="canvas-wrap">
  <canvas id="cv"></canvas>
  <div id="status">Loading buildings...</div>
</div>
<div id="panel">
  <div class="sg"><label>X Position</label><div class="row"><input type="range" id="rX" min="50" max="4500" step="5"><span class="v" id="vX">0</span></div></div>
  <div class="sg"><label>Scale</label><div class="row"><input type="range" id="rS" min="0.05" max="1.0" step="0.005"><span class="v" id="vS">0</span></div></div>
  <div class="sg"><label>Y Offset</label><div class="row"><input type="range" id="rY" min="-150" max="150" step="1"><span class="v" id="vY">0</span></div></div>
  <button id="expBtn" onclick="doExport()">Export SL Config</button>
</div>

<div id="modal"><div id="mbox">
  <textarea id="expTxt" readonly></textarea>
  <button onclick="navigator.clipboard.writeText(document.getElementById('expTxt').value);this.textContent='Copied!'" style="background:#00C9B1">Copy</button>
  <button onclick="document.getElementById('modal').classList.remove('show')" style="background:#666;margin-left:6px">Close</button>
</div></div>

<script>
var AP='/assets/community-builder/town/Buildings/';
var GROUND=0.72;
var WW=4500;

var BLDS=[
  {ck:'busdriver',    b:'bus-stop',          l:'Bus Stop',          e:'\u{1F68C}'},
  {ck:'firefighter',  b:'fire-station',      l:'Fire Station',      e:'\u{1F692}'},
  {ck:'police',       b:'police-station',    l:'Police Station',    e:'\u{1F694}'},
  {ck:'doctor',       b:'hospital',          l:'Hospital',          e:'\u{1F3E5}'},
  {ck:'mailcarrier',  b:'post-office',       l:'Post Office',       e:'\u{1F4EC}'},
  {ck:'librarian',    b:'library',           l:'Library',           e:'\u{1F4D6}'},
  {ck:'farmer',       b:'farmers-market',    l:'Farmers Market',    e:'\u{1F33D}'},
  {ck:'chef',         b:'pizza-shop',        l:'Pizza Shop',        e:'\u{1F355}'},
  {ck:'teacher',      b:'school',            l:'School',            e:'\u{1F4DA}'},
  {ck:'mechanic',     b:'auto-shop',         l:'Auto Shop',         e:'\u{1F527}'},
  {ck:'vet',          b:'vet-clinic',        l:'Vet Clinic',        e:'\u{1F43E}'},
  {ck:'construction', b:'construction-site', l:'Construction Site', e:'\u{1F3D7}\u{FE0F}'}
];

var defX={busdriver:200,firefighter:550,police:900,doctor:1250,mailcarrier:1600,librarian:1950,farmer:2300,chef:2650,teacher:3000,mechanic:3350,vet:3700,construction:4050};
var CFG={};
BLDS.forEach(function(b){CFG[b.ck]={x:defX[b.ck]||200,s:0.45,y:0}});

var images={}, sel=null, camX=0;
var cv, ctx;
var dragging=false, dragSX=0, dragSCX=0;

function loadAll(cb){
  var n=BLDS.length, done=0, ok=0;
  BLDS.forEach(function(b){
    var img=new Image();
    img.onload=function(){
      images[b.ck]=img;
      ok++; done++;
      document.getElementById('status').textContent='Loaded '+ok+'/'+n+'...';
      if(done>=n)cb(ok);
    };
    img.onerror=function(){
      console.error('FAILED to load: '+AP+b.b+'.png');
      done++;
      if(done>=n)cb(ok);
    };
    img.src=AP+b.b+'.png';
  });
}

function buildButtons(){
  var top=document.getElementById('top');
  BLDS.forEach(function(b){
    var btn=document.createElement('button');
    btn.className='cb';
    btn.textContent=b.e+' '+b.l;
    btn.onclick=function(){pick(b.ck)};
    btn.id='btn-'+b.ck;
    top.appendChild(btn);
  });
}

function pick(ck){
  sel=ck;
  document.querySelectorAll('.cb').forEach(function(b){b.classList.remove('on')});
  var btn=document.getElementById('btn-'+ck);
  if(btn)btn.classList.add('on');
  var c=CFG[ck];
  document.getElementById('rX').value=c.x;
  document.getElementById('rS').value=c.s;
  document.getElementById('rY').value=c.y;
  updLabels();
  camX=Math.max(0,c.x-cv.width/2);
  draw();
}

function updLabels(){
  if(!sel)return;
  var c=CFG[sel];
  document.getElementById('vX').textContent=c.x;
  document.getElementById('vS').textContent=c.s.toFixed(3);
  document.getElementById('vY').textContent=c.y;
}

function onSlider(){
  if(!sel)return;
  CFG[sel].x=parseFloat(document.getElementById('rX').value);
  CFG[sel].s=parseFloat(document.getElementById('rS').value);
  CFG[sel].y=parseFloat(document.getElementById('rY').value);
  updLabels();
  draw();
}

function draw(){
  if(!ctx)return;
  var W=cv.width, H=cv.height;
  var gy=Math.floor(H*GROUND);

  ctx.clearRect(0,0,W,H);

  // Sky
  ctx.fillStyle='#87CEEB';
  ctx.fillRect(0,0,W,gy);

  // Ground
  var grd=ctx.createLinearGradient(0,gy,0,H);
  grd.addColorStop(0,'#4a8c3f');grd.addColorStop(1,'#3d7a34');
  ctx.fillStyle=grd;
  ctx.fillRect(0,gy,W,H-gy);

  // Sidewalk
  ctx.fillStyle='#bbb';
  ctx.fillRect(0,gy,W,10);

  // Road
  ctx.fillStyle='#555';
  ctx.fillRect(0,gy+10,W,50);

  // Dashed line
  ctx.strokeStyle='#FFD93D';
  ctx.lineWidth=2;
  ctx.setLineDash([12,8]);
  ctx.beginPath();
  ctx.moveTo(0,gy+35);
  ctx.lineTo(W,gy+35);
  ctx.stroke();
  ctx.setLineDash([]);

  // Buildings
  BLDS.forEach(function(b){
    var img=images[b.ck];
    if(!img)return;
    var c=CFG[b.ck];
    var sx=c.x-camX;
    var s=c.s;
    var w=img.naturalWidth*s;
    var h=img.naturalHeight*s;
    var dx=sx-w/2;
    var dy=gy-h+c.y;

    // Selected highlight
    if(b.ck===sel){
      ctx.strokeStyle='#FFD93D';
      ctx.lineWidth=3;
      ctx.strokeRect(dx-4,dy-4,w+8,h+8);
    }

    ctx.drawImage(img,dx,dy,w,h);

    // Label below
    ctx.font='bold 11px sans-serif';
    ctx.textAlign='center';
    var txt=b.e+' '+b.l;
    var tw=ctx.measureText(txt).width+10;
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(sx-tw/2,gy+c.y+4,tw,16);
    ctx.fillStyle='#fff';
    ctx.fillText(txt,sx,gy+c.y+16);
  });
}

function resize(){
  var wrap=document.getElementById('canvas-wrap');
  cv.width=wrap.offsetWidth;
  cv.height=wrap.offsetHeight;
  draw();
}

function doExport(){
  var lines=['var SL={'];
  var keys=Object.keys(CFG);
  var perLine=3;
  for(var i=0;i<keys.length;i+=perLine){
    var chunk=keys.slice(i,i+perLine).map(function(ck){
      var c=CFG[ck];
      var p=ck+':{x:'+c.x+',s:'+c.s.toFixed(3);
      if(c.y!==0)p+=',y:'+c.y;
      p+='}';
      return p;
    });
    lines.push('  '+chunk.join(',')+(i+perLine<keys.length?',':''));
  }
  lines.push('};');
  document.getElementById('expTxt').value=lines.join('\n');
  document.getElementById('modal').classList.add('show');
}

window.addEventListener('load',function(){
  cv=document.getElementById('cv');
  ctx=cv.getContext('2d');
  buildButtons();
  resize();

  document.getElementById('rX').addEventListener('input',onSlider);
  document.getElementById('rS').addEventListener('input',onSlider);
  document.getElementById('rY').addEventListener('input',onSlider);

  // Drag to pan
  cv.addEventListener('mousedown',function(e){
    var rect=cv.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(cv.width/rect.width)+camX;
    var my=(e.clientY-rect.top)*(cv.height/rect.height);
    var gy=cv.height*GROUND;
    // Hit test buildings (reverse order so top-most wins)
    var hit=null;
    for(var i=BLDS.length-1;i>=0;i--){
      var b=BLDS[i], img=images[b.ck];
      if(!img)continue;
      var c=CFG[b.ck], s=c.s;
      var w=img.naturalWidth*s, h=img.naturalHeight*s;
      var bx=c.x-w/2, by=gy-h+c.y;
      if(mx>=bx&&mx<=bx+w&&my>=by&&my<=by+h){hit=b.ck;break}
    }
    if(hit){pick(hit);return}
    dragging=true;dragSX=e.clientX;dragSCX=camX;
    cv.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;
    camX=dragSCX-(e.clientX-dragSX);
    camX=Math.max(0,Math.min(WW-cv.width,camX));
    draw();
  });
  window.addEventListener('mouseup',function(){
    dragging=false;cv.style.cursor='grab';
  });

  // Scroll to pan
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    camX+=e.deltaX||e.deltaY;
    camX=Math.max(0,Math.min(WW-cv.width,camX));
    draw();
  },{passive:false});

  window.addEventListener('resize',resize);

  loadAll(function(ok){
    document.getElementById('status').textContent=ok+'/'+BLDS.length+' buildings loaded. Click one to tune.';
    setTimeout(function(){document.getElementById('status').style.display='none'},3000);
    pick('busdriver');
  });
});
</script>
</body></html>
