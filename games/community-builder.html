<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="description" content="Community Builder is a free social studies game for kids ages 4-10. Answer questions about community helpers, rules, and maps to build your own town! Play free on Crabcake Kids!"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preload" href="/fonts/Nunito-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Nunito-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="canonical" href="https://crabcake.kids/games/community-builder.html">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90D9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crabcake">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Community Builder - Free Social Studies Game for Kids Ages 4-10 | Crabcake Kids</title>
  <noscript></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Nunito';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Nunito-Bold.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Nunito-ExtraBold.woff2') format('woff2')}
@font-face{font-family:'Boogaloo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Boogaloo-Regular.woff2') format('woff2')}
:root{--bg:#1a3a5c;--sky:#4A90D9;--yellow:#FFD93D;--coral:#FF5C5C;--green:#4ECB71;--purple:#A66CFF;--teal:#00C9B1;--white:#fff}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;touch-action:manipulation;user-select:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;overflow:hidden}
.screen.hidden{display:none}
#startScreen{z-index:20;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.gi{font-size:4rem;margin-bottom:.3rem;animation:bob 3s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.gt{font-family:'Boogaloo',cursive;font-size:clamp(2.4rem,8vw,4rem);color:var(--sky);text-shadow:0 3px 12px rgba(74,144,217,.4);text-align:center;line-height:1;margin-bottom:.2rem}
.gs{color:rgba(255,255,255,.5);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.4rem}
.sbtn{margin-top:.6rem;padding:.75rem 2rem;border-radius:50px;border:none;font-family:'Boogaloo',cursive;font-size:1.2rem;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--green));color:#fff;box-shadow:0 4px 24px rgba(74,144,217,.45)}
.sbtn:disabled{background:rgba(255,255,255,.1);box-shadow:none;color:rgba(255,255,255,.3);cursor:not-allowed}
.sbtn.active{animation:bp2 1.2s ease-in-out infinite}
@keyframes bp2{0%,100%{transform:scale(1);box-shadow:0 4px 24px rgba(74,144,217,.45)}50%{transform:scale(1.05);box-shadow:0 6px 32px rgba(74,144,217,.75)}}
#bandDisplay{margin:.6rem 0 1.2rem;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem}
.bpill{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.4rem;border-radius:50px;font-size:1.05rem;font-weight:800;border:2px solid}
.bpill.b1{color:#FFD93D;border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.12)}
.bpill.b2{color:#00C9B1;border-color:rgba(0,201,177,.5);background:rgba(0,201,177,.12)}
.bpill.b3{color:#A66CFF;border-color:rgba(166,108,255,.5);background:rgba(166,108,255,.12)}
.bsn{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35)}
.bnoinfo{text-align:center;font-size:.88rem;font-weight:700;color:rgba(255,255,255,.5);max-width:260px;line-height:1.6}
.bnoinfo a{color:var(--sky);text-decoration:none;font-weight:900}
.blink{color:rgba(255,255,255,.35);font-size:.75rem;text-decoration:none;letter-spacing:1px;margin-top:.5rem}
#loadScreen{z-index:25;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.lbg{width:220px;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:1rem}
.lfill{height:100%;width:0%;border-radius:7px;background:linear-gradient(90deg,var(--sky),var(--green));transition:width .15s}
.ltxt{color:rgba(255,255,255,.5);font-size:.75rem;margin-top:.4rem}
#gameWrap{position:fixed;inset:0;z-index:5;display:none}
#gameWrap.active{display:block}
#gameWrap canvas{display:block;width:100%!important;height:100%!important}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:15;display:none;padding:.4rem .8rem;background:linear-gradient(180deg,rgba(15,37,64,.7),transparent)}
#hud.active{display:flex;justify-content:space-between;align-items:center}
.hb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}
.hs{font-family:'Boogaloo',cursive;font-size:1.1rem;color:var(--yellow)}
.hp{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:700}

/* ═══ QUESTION — TOP OF SCREEN ═══ */
#qOver{position:fixed;top:0;left:0;right:0;z-index:30;display:none;flex-direction:column;align-items:center;padding:.6rem .8rem;background:linear-gradient(180deg,rgba(15,37,64,.92) 0%,rgba(15,37,64,.85) 85%,transparent 100%)}
#qOver.active{display:flex}
.qc{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;margin-top:.3rem}
.qc img{width:44px;height:44px;border-radius:50%;border:2px solid var(--yellow);background:rgba(255,255,255,.1);object-fit:cover}
.qc .cn{font-family:'Boogaloo',cursive;font-size:1.1rem;color:var(--yellow)}
.qt{font-size:.95rem;color:#fff;line-height:1.4;margin-bottom:.6rem;font-weight:700;text-align:center;max-width:560px}
.qog{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;max-width:600px;margin-bottom:.3rem}
.qb{padding:.6rem 1.2rem;border-radius:30px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;transition:all .2s;min-width:120px;text-align:center}
.qb:hover{background:rgba(74,144,217,.25);border-color:var(--sky);transform:translateY(-2px)}
.qb.ok{border-color:var(--green);background:rgba(78,203,113,.3)}.qb.no{border-color:var(--coral);background:rgba(255,92,92,.25)}
.qh{padding:.4rem .7rem;border-radius:8px;background:rgba(255,217,61,.1);border:1px solid rgba(255,217,61,.25);color:var(--yellow);font-size:.75rem;display:none;text-align:center;max-width:400px}
.qh.vis{display:block}

/* CELEB */
#celeb{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#celeb.active{display:flex}
.ccd{background:rgba(15,37,64,.95);border-radius:26px;padding:1.6rem;max-width:360px;width:88%;text-align:center;border:3px solid var(--yellow);box-shadow:0 0 50px rgba(255,217,61,.25)}
.ccd h2{font-family:'Boogaloo',cursive;font-size:1.6rem;color:var(--yellow);margin:.3rem 0}
.ccd p{color:rgba(255,255,255,.7);margin-bottom:.7rem;font-size:.85rem}
.cbtn{padding:.55rem 1.6rem;border-radius:50px;border:none;font-family:'Boogaloo',cursive;font-size:1rem;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--green));color:#fff}
#finishScreen{z-index:50;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.fc{background:rgba(15,37,64,.95);border-radius:26px;padding:1.8rem;max-width:420px;width:90%;text-align:center;border:3px solid var(--green)}
.fc h2{font-family:'Boogaloo',cursive;font-size:2rem;color:var(--green)}
.ftn{font-family:'Boogaloo',cursive;font-size:1.4rem;color:var(--yellow);margin:.4rem 0}
.fst{color:rgba(255,255,255,.6);font-size:.85rem;margin:.2rem 0}
.frb{margin-top:.8rem;padding:.6rem 1.8rem;border-radius:50px;border:none;font-family:'Boogaloo',cursive;font-size:1.05rem;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--green));color:#fff}
.fhl{display:block;margin-top:.7rem;color:rgba(255,255,255,.4);font-size:.7rem;text-decoration:none}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(70vh) rotate(400deg);opacity:0}}
</style>
</head>
<body>

<div id="startScreen" class="screen">
  <div class="gi">&#x1F3D8;&#xFE0F;</div>
  <div class="gt">Community Builder</div>
  <div class="gs">social studies</div>
  <div id="bandDisplay"></div>
  <button class="sbtn" id="startBtn" disabled>Build Your Town!</button>
  <a href="/" class="blink">&larr; CRABCAKE KIDS</a>
</div>

<div id="loadScreen" class="screen hidden">
  <div class="gi">&#x1F3D7;&#xFE0F;</div>
  <div class="gt" style="font-size:clamp(1.6rem,5vw,2.5rem)">Building Town&hellip;</div>
  <div class="lbg"><div class="lfill" id="lBar"></div></div>
  <div class="ltxt" id="lTxt">Loading&hellip;</div>
</div>

<div id="gameWrap"></div>

<div id="hud">
  <button class="hb" id="homeBtn">&#x1F3E0;</button>
  <div class="hs">&#x2B50; <span id="scD">0</span></div>
  <div class="hp"><span id="prD">0</span>/10 buildings</div>
</div>

<!-- Question at TOP -->
<div id="qOver">
  <div class="qc"><img id="qImg" src="" alt="" onerror="this.style.display='none'"><span class="cn" id="qNm"></span></div>
  <div class="qt" id="qTx"></div>
  <div class="qog" id="qOp"></div>
  <div class="qh" id="qHi"></div>
</div>

<div id="celeb">
  <div class="ccd">
    <div style="font-size:2.5rem" id="cEm"></div>
    <h2 id="cTi"></h2>
    <p id="cTx"></p>
    <button class="cbtn" id="cBt">Keep Building!</button>
  </div>
</div>

<div id="finishScreen" class="screen hidden">
  <div class="fc">
    <div style="font-size:3.2rem">&#x1F3D8;&#xFE0F;&#x1F389;</div>
    <h2>Town Complete!</h2>
    <div class="ftn" id="fTn"></div>
    <div class="fst" id="fSc"></div>
    <div class="fst" id="fAc"></div>
    <button class="frb" onclick="location.reload()">Build Another Town</button>
    <a href="/" class="fhl">&larr; Back to Crabcake Kids</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* Community Builder v11 — sidewalk walk position */
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};

/* ── LAYOUT ──
   World is 3600px wide. Camera permanently zoomed 2x (viewport 600x400).
   Layout top→bottom: sky, bg buildings, bg trees, grass, buildings, sidewalk, road, bottom grass.
   Character walks on sidewalk between buildings and road. */
var GW=1200,GH=800,WW=3600,RY=700,AP='/assets/community-builder';
var WALKY=RY+42;
var CHARS=['firefighter','doctor','police','chef','farmer','teacher','librarian','construction','mailcarrier','busdriver'];
var CI={
  firefighter:{n:'Firefighter Frankie',e:'\u{1F692}',b:'fire_station',v:'car_red',l:'Fire Station'},
  doctor:{n:'Doctor Dana',e:'\u{1F3E5}',b:'hospital',v:'ambulance',l:'Hospital'},
  police:{n:'Officer Oakley',e:'\u{1F694}',b:'building_medium_gray',v:'police_car',l:'Police Station'},
  chef:{n:'Chef Charlie',e:'\u{1F355}',b:'pizzeria',v:'van_black',l:'Pizzeria'},
  farmer:{n:'Farmer Fern',e:'\u{1F33D}',b:'mini_mart',v:null,l:'Mini Mart'},
  teacher:{n:'Teacher Tayo',e:'\u{1F4DA}',b:'coffee_shop',v:'car_blue',l:'School'},
  librarian:{n:'Librarian Lily',e:'\u{1F4D6}',b:'building_large_teal',v:null,l:'Library'},
  construction:{n:'Builder Blake',e:'\u{1F3D7}\u{FE0F}',b:null,v:null,l:'Infrastructure'},
  mailcarrier:{n:'Mail Carrier Mo',e:'\u{1F4EC}',b:'building_medium_orange',v:'van_white',l:'Post Office'},
  busdriver:{n:'Bus Driver Bella',e:'\u{1F68C}',b:'gas_station',v:'taxi',l:'Gas Station'}
};
/* 9 building slots — 380px apart, uniform scale to prevent overlap */
var SL={
  busdriver:  {x:200, s:.45},
  firefighter:{x:580, s:.45},
  police:     {x:960, s:.45},
  doctor:     {x:1340,s:.45},
  mailcarrier:{x:1720,s:.45},
  librarian:  {x:2100,s:.45},
  farmer:     {x:2480,s:.45},
  chef:       {x:2860,s:.45},
  teacher:    {x:3240,s:.45}
};
var VM={doctor:'ambulance',police:'police_car',busdriver:'taxi',mailcarrier:'van_white',chef:'van_black',firefighter:'car_red',teacher:'car_blue'};
var CP=[{k:'sign_stop',x:390,s:.45},{k:'sign_warning',x:770,s:.4},{k:'sign_construction_1',x:1150,s:.4},{k:'light_pole_1',x:1530,s:.35},{k:'fence_wood',x:1910,s:.45},{k:'water_hydrant',x:2290,s:.45},{k:'sign_st_name',x:2670,s:.4},{k:'light_pole_2',x:3050,s:.35}];

var D={sky:0,bgBuild2:1,bgTree2:2,bgBuild1:3,bgTree1:4,tree:5,ground:6,ghost:7,prop:8,building:10,vehicle:11,walker:12,charIntro:50};

var G={band:null,bn:1,qs:[],queue:[],score:0,ans:0,corr:0,cp:{},pi:0,ul:0,dm:false,sc:null,gm:null,introSpr:null,camTarget:0,curChar:null,patrolDir:1,patrolSpeed:43,entering:false};
var clouds=[],walkers=[],bldSpr={},propSpr=[];

function showScr(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.add('hidden')});if(id)$(id).classList.remove('hidden')}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function updHUD(){$('scD').textContent=G.score;$('prD').textContent=G.ul}

/* ── BAND FROM URL ── */
var params=new URLSearchParams(window.location.search);
var urlBand=params.get('band');
var savedBand=null;try{savedBand=localStorage.getItem('ck_band')}catch(e){}
var BMETA={band_1:{bn:1,cls:'b1',lbl:'\u{1F9D2} Ages 4\u20136',sub:'Ontario Kindergarten Program'},band_2:{bn:2,cls:'b2',lbl:'\u{1F4D7} Grades 1\u20132',sub:'Ontario Social Studies'},band_3:{bn:3,cls:'b3',lbl:'\u{1F4D8} Grades 3\u20134',sub:'Ontario Social Studies'}};
if(urlBand&&BMETA[urlBand]){
  G.band=urlBand;G.bn=BMETA[urlBand].bn;G.dm=G.bn>=2;
  $('bandDisplay').innerHTML='<div class="bpill '+BMETA[urlBand].cls+'">'+BMETA[urlBand].lbl+'</div><div class="bsn">'+BMETA[urlBand].sub+'</div>';
  $('startBtn').disabled=false;$('startBtn').classList.add('active');
}else if(savedBand&&BMETA[savedBand]){
  G.band=savedBand;G.bn=BMETA[savedBand].bn;G.dm=G.bn>=2;
  $('bandDisplay').innerHTML='<div class="bpill '+BMETA[savedBand].cls+'">'+BMETA[savedBand].lbl+'</div><div class="bsn">\u21A9 continuing from last visit</div>';
  $('startBtn').disabled=false;$('startBtn').classList.add('active');
}else{
  $('bandDisplay').innerHTML='<div class="bnoinfo">\u{1F449} <a href="/index.html#games">Visit the homepage</a> and pick your age group first for the best experience!</div>';
}
$('startBtn').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',function(){if(confirm('Leave? Progress will be lost.'))location.href='/'});

/* ── START ── */
function startGame(){
  if(!G.band)return;
  showScr('loadScreen');
  $('lBar').style.width='5%';$('lTxt').textContent='Loading questions...';
  fetch('/data/community-builder-questions.json?v=1').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(d){
    G.qs=d.question_sets;
    $('lBar').style.width='15%';
    var bq=G.qs.filter(function(s){return s.band_id===G.band});
    var bc={};
    bq.forEach(function(set){
      if(!bc[set.character])bc[set.character]=[];
      var q=set.questions.slice();shuf(q);
      q.forEach(function(qi){bc[set.character].push({question:qi.question,options:qi.options,correct:qi.correct,hint:qi.hint,character:set.character})});
    });
    CHARS.forEach(function(c){G.cp[c]={cor:0,unl:false}});
    var queue=[];var charOrder=CHARS.slice();shuf(charOrder);
    charOrder.forEach(function(c){if(bc[c])queue=queue.concat(bc[c])});
    G.queue=queue;
    $('lBar').style.width='20%';$('lTxt').textContent='Loading town...';
    bootPhaser();
  }).catch(function(e){$('lTxt').textContent='Error: '+e.message});
}

/* ── PHASER ── */
function bootPhaser(){
  G.gm=new Phaser.Game({
    type:Phaser.AUTO,width:GW,height:GH,parent:'gameWrap',backgroundColor:'#87CEEB',
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
    scene:{preload:phaserPreload,create:phaserCreate,update:phaserUpdate},
    banner:false,audio:{noAudio:true}
  });
}

function phaserPreload(){
  var self=this;
  self.load.on('progress',function(v){$('lBar').style.width=Math.round(20+v*75)+'%';$('lTxt').textContent='Loading town assets... '+Math.round(v*100)+'%'});
  self.load.on('loaderror',function(f){console.warn('Skipped:',f.key)});
  CHARS.forEach(function(c){
    self.load.spritesheet(c+'-idle',AP+'/sprites/idle/'+c+'-idle.png',{frameWidth:384,frameHeight:384});
    self.load.spritesheet(c+'-walk',AP+'/sprites/walk/'+c+'-walk.png',{frameWidth:384,frameHeight:384});
    self.load.image(c+'-st',AP+'/sprites/static/'+c+'.png');
  });
  /* Foreground buildings */
  ['hospital','fire_station','building_medium_gray','building_medium_orange','building_large_teal','mini_mart','pizzeria','coffee_shop','gas_station','bank','barber_shop','donut_shop'].forEach(function(b){self.load.image('b-'+b,AP+'/town/Buildings/'+b+'.png')});
  /* Background buildings (2 depth layers) */
  ['building_large_background_1','building_large_background_2','building_medium_background_1','building_medium_background_2','building_small_background_1','building_small_background_2','house_large_background_1','house_large_background_2','house_medium_background_1','house_medium_background_2','warehouse_background_1','warehouse_background_2'].forEach(function(b){self.load.image('bg-'+b,AP+'/town/Buildings/'+b+'.png')});
  /* Vehicles */
  ['ambulance','police_car','taxi','van_white','van_black','car_red','car_blue'].forEach(function(v){self.load.image('v-'+v,AP+'/town/Vehicles/'+v+'.png')});
  /* Props */
  ['sign_stop','sign_warning','sign_construction_1','sign_st_name','light_pole_1','light_pole_2','light_pole_3','fence_wood','fence_garden_brown','water_hydrant','light_post'].forEach(function(p){self.load.image('p-'+p,AP+'/town/Props/'+p+'.png')});
  /* Foreground vegetation */
  ['tree_01','tree_02','tree_03','bush_01','bush_02','weeds_01','weeds_02','weeds_03'].forEach(function(v){self.load.image('t-'+v,AP+'/town/Vegetation/'+v+'.png')});
  /* Background vegetation (2 depth layers) */
  ['tree_01_background_1','tree_01_background_2','tree_02_background_1','tree_02_background_2'].forEach(function(v){self.load.image('tbg-'+v,AP+'/town/Vegetation/'+v+'.png')});
  /* Clouds */
  for(var i=1;i<=6;i++)self.load.image('cl-'+i,AP+'/town/Props/cloud_0'+i+'.png');
}

function phaserCreate(){
  G.sc=this;clouds=[];walkers=[];bldSpr={};propSpr=[];
  var sc=this;

  /* Animations */
  CHARS.forEach(function(c){
    if(sc.textures.exists(c+'-idle'))sc.anims.create({key:c+'-ia',frames:sc.anims.generateFrameNumbers(c+'-idle',{start:0,end:8}),frameRate:4,repeat:-1});
    if(sc.textures.exists(c+'-walk'))sc.anims.create({key:c+'-wa',frames:sc.anims.generateFrameNumbers(c+'-walk',{start:0,end:8}),frameRate:8,repeat:-1});
  });

  /* Camera — permanently zoomed 2x */
  sc.cameras.main.setBounds(0,0,WW,GH);
  sc.cameras.main.setZoom(2);

  /* ═══ SKY ═══ */
  var sky=sc.add.graphics().setDepth(D.sky);
  sky.fillGradientStyle(0x5ba8d9,0x5ba8d9,0xb8ddf5,0xb8ddf5,1);
  sky.fillRect(0,0,WW,GH);

  /* ═══ CLOUDS — larger, lower, visible above buildings ═══ */
  var cloudKeys=['cl-1','cl-2','cl-3','cl-4','cl-5','cl-6'];
  for(var ci=0;ci<8;ci++){
    var ck2='cl-'+(ci%6+1);
    if(!sc.textures.exists(ck2))continue;
    var cy=280+Math.random()*120;
    var cld=sc.add.image(Math.random()*WW,cy,ck2).setScale(.55+Math.random()*.35).setAlpha(.35+Math.random()*.2).setDepth(D.sky+1).setScrollFactor(.3);
    cld._sp=3+Math.random()*4;clouds.push(cld);
  }

  /* ═══ BACKGROUND LAYER 2 — darkest, furthest back ═══ */
  var bgKeys2=['bg-building_large_background_2','bg-building_medium_background_2','bg-building_small_background_2','bg-house_large_background_2','bg-house_medium_background_2','bg-warehouse_background_2'];
  for(var bi=0;bi<12;bi++){
    var bk2=bgKeys2[bi%bgKeys2.length];
    if(!sc.textures.exists(bk2))continue;
    sc.add.image(150+bi*300+Math.random()*60,RY-40,bk2).setScale(.35+Math.random()*.1).setOrigin(.5,1).setDepth(D.bgBuild2).setScrollFactor(.5).setAlpha(.7);
  }
  /* Background trees layer 2 */
  var tBgKeys2=['tbg-tree_01_background_2','tbg-tree_02_background_2'];
  for(var ti=0;ti<10;ti++){
    var tk2=tBgKeys2[ti%tBgKeys2.length];
    if(!sc.textures.exists(tk2))continue;
    sc.add.image(100+ti*360+Math.random()*80,RY-10,tk2).setScale(.35+Math.random()*.1).setOrigin(.5,1).setDepth(D.bgTree2).setScrollFactor(.55).setAlpha(.7);
  }

  /* ═══ BACKGROUND LAYER 1 — mid-dark ═══ */
  var bgKeys1=['bg-building_large_background_1','bg-building_medium_background_1','bg-building_small_background_1','bg-house_large_background_1','bg-house_medium_background_1','bg-warehouse_background_1'];
  for(var bi2=0;bi2<10;bi2++){
    var bk1=bgKeys1[bi2%bgKeys1.length];
    if(!sc.textures.exists(bk1))continue;
    sc.add.image(250+bi2*350+Math.random()*80,RY-20,bk1).setScale(.38+Math.random()*.08).setOrigin(.5,1).setDepth(D.bgBuild1).setScrollFactor(.65).setAlpha(.8);
  }
  /* Background trees layer 1 */
  var tBgKeys1=['tbg-tree_01_background_1','tbg-tree_02_background_1'];
  for(var ti2=0;ti2<8;ti2++){
    var tk1=tBgKeys1[ti2%tBgKeys1.length];
    if(!sc.textures.exists(tk1))continue;
    sc.add.image(200+ti2*440+Math.random()*100,RY,tk1).setScale(.4+Math.random()*.1).setOrigin(.5,1).setDepth(D.bgTree1).setScrollFactor(.7).setAlpha(.85);
  }

  /* ═══ FOREGROUND TREES — between building slots ═══ */
  var fgTreeX=[100,390,770,1150,1530,1910,2290,2670,3050,3400];
  fgTreeX.forEach(function(tx,i){
    var k='t-'+(i%3===0?'tree_01':i%3===1?'tree_02':'tree_03');
    if(sc.textures.exists(k))sc.add.image(tx+Math.random()*40-20,RY+25,k).setScale(.4+Math.random()*.12).setOrigin(.5,1).setDepth(D.tree);
  });
  /* Bushes and weeds along the grass strip */
  for(var wi=0;wi<20;wi++){
    var wk='t-weeds_0'+(wi%3+1);
    if(sc.textures.exists(wk))sc.add.image(wi*185+Math.random()*60,RY+26+Math.random()*4,wk).setScale(.3+Math.random()*.15).setOrigin(.5,1).setDepth(D.tree);
  }
  for(var bsi=0;bsi<6;bsi++){
    var bsk='t-bush_0'+(bsi%2+1);
    if(sc.textures.exists(bsk))sc.add.image(300+bsi*600+Math.random()*100,RY+26,bsk).setScale(.35+Math.random()*.1).setOrigin(.5,1).setDepth(D.tree);
  }

  /* ═══ GROUND — grass on top, sidewalk, road to bottom ═══ */
  var g=sc.add.graphics().setDepth(D.ground);
  /* Grass strip above sidewalk */
  g.fillStyle(0x5a9e4b);g.fillRect(0,RY,WW,25);
  g.fillStyle(0x4a8e3b);g.fillRect(0,RY+20,WW,8);
  /* Sidewalk */
  g.fillStyle(0xccbbaa);g.fillRect(0,RY+28,WW,16);
  /* Road — extends to bottom of world */
  g.fillStyle(0x555555);g.fillRect(0,RY+44,WW,GH-RY-44);
  /* Road center line */
  g.fillStyle(0xffdd44);
  for(var rx=0;rx<WW;rx+=55)g.fillRect(rx,RY+65,28,3);

  /* Building slots — no ghost outlines */
  Object.keys(SL).forEach(function(ck){
    bldSpr[ck]={ghost:null,sprite:null};
  });

  /* Prop slots — no ghost outlines */
  CP.forEach(function(p){
    propSpr.push({ghost:null,sprite:null});
  });

  /* ═══ CAMERA — create invisible follow target, start following ═══ */
  G.camTarget=sc.add.rectangle(WW/2,WALKY,4,4,0x000000,0).setDepth(0);
  G.camTarget.x=300;
  sc.cameras.main.startFollow(G.camTarget,true,0.06,0.06,0,40);

  /* Ready */
  $('lBar').style.width='100%';$('lTxt').textContent='Ready!';
  setTimeout(function(){
    showScr(null);$('gameWrap').classList.add('active');$('hud').classList.add('active');
    setTimeout(nextQ,800);
  },400);
}

function phaserUpdate(time,delta){
  clouds.forEach(function(cl){cl.x+=cl._sp*(delta/1000);if(cl.x>WW+200)cl.x=-200});
  walkers.forEach(function(w){w.spr.x+=w.dir*w.sp*(delta/1000);w.spr.setFlipX(w.dir<0);if(w.spr.x>w.mx)w.dir=-1;if(w.spr.x<w.mn)w.dir=1});
  /* Patrol intro sprite during questions */
  if(G.introSpr&&G.introSpr.active&&!G.entering){
    var s=G.introSpr;
    s.x+=G.patrolDir*G.patrolSpeed*(delta/1000);
    s.setFlipX(G.patrolDir<0);
    if(s.x>WW-60){G.patrolDir=-1}
    if(s.x<60){G.patrolDir=1}
    /* Camera follow target tracks the character */
    G.camTarget.x+=(s.x-G.camTarget.x)*0.08;
  }
}

/* ── PAN CAMERA to a world x position ── */
function panTo(wx){
  if(G.sc&&G.camTarget)G.sc.tweens.add({targets:G.camTarget,x:wx,duration:1200,ease:'Sine.easeInOut'});
}

/* ── PLACE BUILDING ── */
function plBld(ck){
  var sc=G.sc;if(!sc)return;var sl=SL[ck];if(!sl)return;
  var bk='b-'+CI[ck].b;if(!sc.textures.exists(bk))return;
  if(bldSpr[ck]&&bldSpr[ck].ghost){bldSpr[ck].ghost.destroy();bldSpr[ck].ghost=null}
  var b=sc.add.image(sl.x,-400,bk).setScale(sl.s).setOrigin(.5,1).setDepth(D.building);
  sc.tweens.add({targets:b,y:RY+28,duration:900,ease:'Bounce.easeOut',onComplete:function(){
    sc.tweens.add({targets:b,scaleX:sl.s*1.06,scaleY:sl.s*.95,yoyo:true,duration:200});
  }});
  bldSpr[ck].sprite=b;
  if(VM[ck])sc.time.delayedCall(1000,function(){plVeh(ck)});
}
function plVeh(ck){
  var sc=G.sc;if(!sc)return;var vk='v-'+VM[ck];if(!sc.textures.exists(vk))return;
  var sl=SL[ck];
  var v=sc.add.image(sl.x+60,WALKY+20,vk).setScale(.65).setAlpha(0).setDepth(D.vehicle);
  sc.tweens.add({targets:v,alpha:1,x:sl.x+20,duration:600,ease:'Power2'});
}
function plProp(idx){
  if(idx>=CP.length)return;var sc=G.sc;if(!sc)return;
  var p=CP[idx];var pk='p-'+p.k;if(!sc.textures.exists(pk))return;
  if(propSpr[idx]&&propSpr[idx].ghost){propSpr[idx].ghost.destroy();propSpr[idx].ghost=null}
  var spr=sc.add.image(p.x,RY+28,pk).setScale(0).setOrigin(.5,1).setAlpha(0).setDepth(D.prop);
  sc.tweens.add({targets:spr,alpha:1,scaleX:p.s,scaleY:p.s,duration:500,ease:'Back.easeOut'});
}

/* ── WALKER ── */
function spWalk(ck){
  var sc=G.sc;if(!sc)return;
  if(!sc.textures.exists(ck+'-walk')||!sc.anims.exists(ck+'-wa'))return;
  var sl=SL[ck]||{x:600};
  var spr=sc.add.sprite(sl.x,WALKY,ck+'-walk').setScale(.33).setOrigin(.5,1).setDepth(D.walker);
  spr.play(ck+'-wa');
  walkers.push({spr:spr,sp:15+Math.random()*12,dir:Math.random()>.5?1:-1,mn:Math.max(sl.x-120,10),mx:Math.min(sl.x+120,WW-10)});
}

/* ── CHARACTER INTRO ──
   Camera is always zoomed 2x. Character walks in from left, camera follows via target. */
function charIntro(ck,cb){
  var sc=G.sc;
  if(!sc||!sc.textures.exists(ck+'-walk')||!sc.anims.exists(ck+'-wa')){
    if(!sc||!sc.textures.exists(ck+'-idle')||!sc.anims.exists(ck+'-ia')){if(cb)cb();return}
  }
  G.curChar=ck;
  var useWalk=sc.textures.exists(ck+'-walk')&&sc.anims.exists(ck+'-wa');

  /* Move camera target to left edge */
  G.camTarget.x=0;

  /* Character starts off-screen left */
  var startX=-50;
  var spr=sc.add.sprite(startX,WALKY,useWalk?(ck+'-walk'):(ck+'-idle')).setScale(.33).setOrigin(.5,1).setDepth(D.charIntro);
  if(useWalk)spr.play(ck+'-wa');else spr.play(ck+'-ia');
  G.introSpr=spr;
  G.patrolDir=1;
  G.entering=true;
  spr.setFlipX(false);

  /* Walk character into view */
  sc.tweens.add({targets:spr,x:200,duration:2500,ease:'Linear',
    onComplete:function(){
      G.entering=false;
      G.camTarget.x=spr.x;
      if(cb)cb();
    }
  });
}

function dismissIntro(cb){
  var sc=G.sc;
  G.curChar=null;
  G.entering=false;
  if(!sc||!G.introSpr){if(cb)setTimeout(cb,500);return}
  var spr=G.introSpr;G.introSpr=null;
  spr.destroy();
  if(cb)setTimeout(cb,500);
}

/* ── DRAG & DROP ── */
function initDrag(ck){
  var sc=G.sc;if(!sc)return;var sl=SL[ck];
  if(!sl||!sc.textures.exists('b-'+CI[ck].b)){plBld(ck);spWalk(ck);doConfetti();setTimeout(nextQ,3000);return}
  var bk='b-'+CI[ck].b;
  var dz=sc.add.graphics().setDepth(D.charIntro-1);
  var gw2=Math.round(sl.s*340);var ghh2=Math.round(sl.s*400);
  dz.lineStyle(3,0xFFD93D,.6);dz.strokeRoundedRect(sl.x-gw2/2-5,RY+28-ghh2-5,gw2+10,ghh2+10,10);
  sc.tweens.add({targets:dz,alpha:.3,yoyo:true,repeat:-1,duration:600});
  var camX=sc.cameras.main.scrollX;
  var vw=GW/sc.cameras.main.zoom;
  var db=sc.add.image(camX+vw/2,RY-200,bk).setScale(sl.s*.7).setInteractive({draggable:true}).setDepth(D.charIntro+1);
  sc.tweens.add({targets:db,scaleX:sl.s*.75,scaleY:sl.s*.75,yoyo:true,repeat:-1,duration:600});
  var lbl=sc.add.text(camX+vw/2,RY-260,'\u{1F446} Drag to the glowing spot!',{fontFamily:'Nunito',fontSize:'14px',fontStyle:'bold',color:'#FFD93D',stroke:'#000',strokeThickness:3}).setOrigin(.5).setDepth(D.charIntro+2);
  var dragFn=function(p,o,dx,dy){o.x=dx;o.y=dy};
  var endFn=function(p,o){
    if(Phaser.Math.Distance.Between(o.x,o.y,sl.x,RY+28-sl.s*200)<140){
      o.disableInteractive();o.destroy();lbl.destroy();dz.destroy();
      sc.input.off('drag',dragFn);sc.input.off('dragend',endFn);
      plBld(ck);spWalk(ck);doConfetti();setTimeout(nextQ,3000);
    }else{sc.tweens.add({targets:o,x:camX+vw/2,y:RY-200,duration:300,ease:'Power2'})}
  };
  sc.input.on('drag',dragFn);sc.input.on('dragend',endFn);
}

/* ── QUESTIONS (DOM at top) ── */
function nextQ(){
  if(!G.queue.length){dismissIntro(function(){finish()});return}
  var allDone=true;for(var k in G.cp){if(!G.cp[k].unl){allDone=false;break}}
  if(allDone){dismissIntro(function(){finish()});return}
  var q=null;while(G.queue.length>0){var c=G.queue.shift();if(!G.cp[c.character].unl){q=c;break}}
  if(!q){dismissIntro(function(){finish()});return}

  /* Same character — stay zoomed, just show next question */
  if(q.character===G.curChar){
    showQ(q);
    return;
  }
  /* Different character — dismiss current, delay, then intro new */
  if(G.curChar){
    dismissIntro(function(){charIntro(q.character,function(){showQ(q)})});
  }else{
    charIntro(q.character,function(){showQ(q)});
  }
}

function showQ(q){
  var c=CI[q.character]||{n:q.character,e:'?'};
  var im=$('qImg');im.style.display='';im.src=AP+'/sprites/static/'+q.character+'.png';
  $('qNm').textContent=c.e+' '+c.n;
  $('qTx').textContent=q.question;
  $('qHi').classList.remove('vis');$('qHi').textContent=q.hint||'';
  var g=$('qOp');g.innerHTML='';
  q.options.forEach(function(o,i){
    var b=document.createElement('button');b.className='qb';b.textContent=o;
    b.addEventListener('click',function(){ansH(i,q,b)});g.appendChild(b);
  });
  $('qOver').classList.add('active');
}

function ansH(ch,q,btn){
  $('qOp').querySelectorAll('.qb').forEach(function(b){b.style.pointerEvents='none'});
  G.ans++;
  if(ch===q.correct){
    btn.classList.add('ok');G.corr++;G.score+=10;
    var p=G.cp[q.character];p.cor++;updHUD();
    if(p.cor>=3&&!p.unl){
      p.unl=true;G.ul++;
      setTimeout(function(){
        $('qOver').classList.remove('active');
        dismissIntro(function(){unlockC(q.character)});
      },600);
    }else{
      /* Same character continues — stay zoomed */
      setTimeout(function(){$('qOver').classList.remove('active');setTimeout(nextQ,500)},700);
    }
  }else{
    btn.classList.add('no');$('qHi').classList.add('vis');
    var btns=$('qOp').querySelectorAll('.qb');
    setTimeout(function(){btns[q.correct].classList.add('ok')},400);
    /* Same character continues — stay zoomed */
    setTimeout(function(){$('qOver').classList.remove('active');setTimeout(nextQ,500)},2000);
  }
}

/* ── UNLOCK ── */
function unlockC(ck){
  var c=CI[ck];
  if(ck==='construction'){
    for(var i=0;i<2&&G.pi<CP.length;i++,G.pi++)plProp(G.pi);
    doConfetti();
    setTimeout(nextQ,3000);
  }else if(G.dm){
    /* Band 2/3 — pan to slot, then user drags building */
    if(SL[ck])panTo(SL[ck].x);
    setTimeout(function(){initDrag(ck)},1400);
  }else{
    /* Band 1 — auto-place building with confetti, 3s delay */
    if(SL[ck])panTo(SL[ck].x);
    setTimeout(function(){plBld(ck);spWalk(ck);doConfetti()},1400);
    setTimeout(nextQ,4500);
  }
  if(G.ul===5&&G.sc&&G.sc.textures.exists('b-bank')){
    var sc2=G.sc;var bankX=1530;
    setTimeout(function(){
      panTo(bankX);
      setTimeout(function(){
        var bk=sc2.add.image(bankX,-300,'b-bank').setScale(.45).setOrigin(.5,1).setDepth(D.building);
        sc2.tweens.add({targets:bk,y:RY+28,duration:900,ease:'Bounce.easeOut'});
        doConfetti();
      },1400);
    },5000);
  }
  updHUD();
}

/* ── CONFETTI ── */
function doConfetti(){var cs=['#FFD93D','#FF5C5C','#4ECB71','#A66CFF','#4A90D9','#FF9040'];for(var i=0;i<25;i++){var d=document.createElement('div');var t=1+Math.random()*1.5;d.style.cssText='position:fixed;width:8px;height:8px;border-radius:'+(Math.random()>.5?'50%':'2px')+';background:'+cs[Math.floor(Math.random()*cs.length)]+';left:'+Math.random()*100+'%;top:-8px;opacity:1;pointer-events:none;z-index:41;animation:cfall '+t+'s ease-out '+Math.random()*.4+'s forwards';document.body.appendChild(d);(function(el,dur){setTimeout(function(){el.remove()},(dur+.5)*1000)})(d,t)}}

function finish(){$('qOver').classList.remove('active');$('hud').classList.remove('active');var a=G.ans?Math.round(G.corr/G.ans*100):0;$('fSc').textContent='\u2B50 Score: '+G.score;$('fAc').textContent='\u{1F3AF} Accuracy: '+a+'% ('+G.corr+'/'+G.ans+')';var adj=['Amazing','Wonderful','Friendly','Happy','Sunny','Cozy','Busy','Peaceful'];var noun=['Town','Village','Neighbourhood','Community','Haven'];$('fTn').textContent=adj[Math.floor(Math.random()*adj.length)]+' '+noun[Math.floor(Math.random()*noun.length)];setTimeout(function(){showScr('finishScreen')},800)}

showScr('startScreen');
})();
</script>
