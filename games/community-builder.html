<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="description" content="Community Builder is a free social studies game for kids ages 4-10. Answer questions about community helpers, rules, and maps to build your own town! Play free on Crabcake Kids!"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preload" href="/fonts/Nunito-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Nunito-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="canonical" href="https://crabcake.kids/games/community-builder.html">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90D9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crabcake">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Community Builder - Free Social Studies Game for Kids Ages 4-10 | Crabcake Kids</title>
  <noscript></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Nunito';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Nunito-Bold.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Nunito-ExtraBold.woff2') format('woff2')}
@font-face{font-family:'Boogaloo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Boogaloo-Regular.woff2') format('woff2')}
:root{--bg:#1a3a5c;--sky:#4A90D9;--yellow:#FFD93D;--coral:#FF5C5C;--green:#4ECB71;--purple:#A66CFF;--teal:#00C9B1;--white:#fff}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;touch-action:manipulation;user-select:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;overflow:hidden}
.screen.hidden{display:none}
#startScreen{z-index:20;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.gi{font-size:4rem;margin-bottom:.3rem;animation:bob 3s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.gt{font-family:'Boogaloo',cursive;font-size:clamp(2.4rem,8vw,4rem);color:var(--sky);text-shadow:0 3px 12px rgba(74,144,217,.4);text-align:center;line-height:1;margin-bottom:.2rem}
.gs{color:rgba(255,255,255,.5);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.4rem}
.sbtn{margin-top:.6rem;padding:.75rem 2rem;border-radius:50px;border:none;font-family:'Boogaloo',cursive;font-size:1.2rem;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--green));color:#fff;box-shadow:0 4px 24px rgba(74,144,217,.45)}
.sbtn:disabled{background:rgba(255,255,255,.1);box-shadow:none;color:rgba(255,255,255,.3);cursor:not-allowed}
.sbtn.active{animation:bp2 1.2s ease-in-out infinite}
@keyframes bp2{0%,100%{transform:scale(1);box-shadow:0 4px 24px rgba(74,144,217,.45)}50%{transform:scale(1.05);box-shadow:0 6px 32px rgba(74,144,217,.75)}}
#bandDisplay{margin:.6rem 0 .6rem;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem}
.bpill{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.4rem;border-radius:50px;font-size:1.05rem;font-weight:800;border:2px solid}
.bpill.b1{color:#FFD93D;border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.12)}
.bpill.b2{color:#00C9B1;border-color:rgba(0,201,177,.5);background:rgba(0,201,177,.12)}
.bpill.b3{color:#A66CFF;border-color:rgba(166,108,255,.5);background:rgba(166,108,255,.12)}
.bsn{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35)}
.bnoinfo{text-align:center;font-size:.88rem;font-weight:700;color:rgba(255,255,255,.5);max-width:260px;line-height:1.6}
.bnoinfo a{color:var(--sky);text-decoration:none;font-weight:900}
/* Inline band picker */
.band-picker-label{font-size:.9rem;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:.5rem}
.band-picker-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.band-picker-btns button{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.7rem .6rem;border-radius:16px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);cursor:pointer;flex:1;min-width:80px;max-width:130px;font-family:'Nunito',sans-serif;transition:transform .15s,background .15s,border-color .15s}
.band-picker-btns button:hover{transform:translateY(-3px);background:rgba(255,255,255,.1)}
.band-picker-btns button .bp-em{font-size:1.4rem}
.band-picker-btns button .bp-age{font-size:.85rem;font-weight:900;color:#fff}
.band-picker-btns button .bp-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:.15rem .5rem;border-radius:50px;border:1.5px solid}
.band-picker-btns button:nth-child(1){border-color:rgba(255,217,61,.35)}
.band-picker-btns button:nth-child(1) .bp-lbl{color:#FFD93D;border-color:rgba(255,217,61,.5)}
.band-picker-btns button:nth-child(2){border-color:rgba(0,201,177,.35)}
.band-picker-btns button:nth-child(2) .bp-lbl{color:#00C9B1;border-color:rgba(0,201,177,.5)}
.band-picker-btns button:nth-child(3){border-color:rgba(166,108,255,.35)}
.band-picker-btns button:nth-child(3) .bp-lbl{color:#A66CFF;border-color:rgba(166,108,255,.5)}
.blink{color:rgba(255,255,255,.35);font-size:.75rem;text-decoration:none;letter-spacing:1px;margin-top:.5rem}
/* Start screen home button — exact match maths-dive */
.hud-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:.3rem .7rem;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;text-decoration:none}
.hud-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.hud-btn:active{transform:translateY(0)}
.hud-btn-icon{font-size:1.2rem;line-height:1}
.hud-btn-label{font-size:.5rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.start-home-btn{position:absolute;top:1rem;left:1rem;z-index:50}
@media(max-width:600px){.hud-btn{padding:.25rem .45rem;border-radius:8px}.hud-btn-icon{font-size:1rem}.hud-btn-label{font-size:.38rem;letter-spacing:1px}}

/* Grade selector — exact match maths-dive */
#gradeSelector{margin:.4rem 0;min-height:20px}
.grade-status{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin:.3rem 0}
.grade-next-label{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.5px}
.grade-all-done{color:#FFD93D}
.grade-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gpill{font-size:.65rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:.25rem .7rem;border-radius:20px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);cursor:default;transition:all .2s;font-family:'Nunito',sans-serif}
.gpill-done{border-color:rgba(78,203,113,.5);background:rgba(78,203,113,.1);color:#4ECB71;cursor:pointer}
.gpill-done:hover{background:rgba(78,203,113,.2);transform:translateY(-1px)}
.gpill-current{border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.12);color:#FFD93D;box-shadow:0 0 8px rgba(255,217,61,.2)}
.gpill-locked{opacity:.4}

/* Load screen */
#loadScreen{z-index:25;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.lbg{width:220px;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:1rem}
.lfill{height:100%;width:0%;border-radius:7px;background:linear-gradient(90deg,var(--sky),var(--green));transition:width .15s}
.ltxt{color:rgba(255,255,255,.5);font-size:.75rem;margin-top:.4rem}
#gameWrap{position:fixed;inset:0;z-index:5;display:none}
#gameWrap.active{display:block}
#gameWrap canvas{display:block;width:100%!important;height:100%!important}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:15;display:none;padding:.4rem .8rem;background:linear-gradient(180deg,rgba(15,37,64,.7),transparent)}
#hud.active{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hud-left{display:flex;align-items:center;gap:.5rem}
.hb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}
.hb-sound{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}
.hs{font-family:'Boogaloo',cursive;font-size:1.1rem;color:var(--yellow)}
.hp{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:700}
.lives-display{display:flex;gap:4px;align-items:center}
.life-heart{font-size:1.4rem;transition:transform .2s,filter .2s}
.life-heart.lost{filter:grayscale(1) opacity(.3);transform:scale(.8)}
@media(max-width:600px){.life-heart{font-size:1rem}}
.hud-right{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}
.hud-center{display:flex;align-items:center;justify-content:center;pointer-events:none}
#cb-avatar-hud{pointer-events:none}
@media(max-width:600px){#cb-avatar-hud svg{width:36px!important;height:36px!important}}

/* Mastery ring — exact match maths-dive */
.mastery-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.mastery-ring{width:38px;height:38px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.mastery-fill{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(0,201,177,.9),rgba(0,150,130,.7));transform:scale(0);transition:transform .5s cubic-bezier(.34,1.56,.64,1);z-index:1}
.mastery-fill.full{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,1),rgba(255,160,0,.85));box-shadow:0 0 12px rgba(255,217,61,.6)}
.mastery-ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);z-index:2}
.mastery-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
.mastery-arc{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.34,1.56,.64,1),stroke .3s}
.mastery-arc.full{stroke:var(--yellow);filter:drop-shadow(0 0 4px rgba(255,217,61,.6))}
.mastery-label{font-size:.42rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35);text-align:center;white-space:nowrap}
/* Band mastery ring colors */
.mastery-fill.band-mastery{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,.9),rgba(255,160,0,.7))}
.mastery-fill.band-mastery.full{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,1),rgba(255,160,0,.9));box-shadow:0 0 16px rgba(255,217,61,.7)}
.mastery-arc.band-mastery{stroke:#FFD93D}
.mastery-arc.band-mastery.full{stroke:#FFD93D;filter:drop-shadow(0 0 6px rgba(255,217,61,.8))}
/* Grade pill in HUD */
.qbar-grade{font-size:.58rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:.2rem .6rem;white-space:nowrap;flex-shrink:0;transition:color .3s,border-color .3s,background .3s}
.qbar-grade.promoted{color:var(--yellow);border-color:rgba(255,217,61,.4);background:rgba(255,217,61,.1)}
@media(max-width:600px){.qbar-grade{font-size:.48rem;padding:.15rem .45rem}.mastery-ring{width:32px;height:32px}.mastery-label{font-size:.38rem}}

/* Nav scroll buttons */
.nav-btn{position:fixed;top:20%;z-index:32;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(15,37,64,.7);color:#fff;font-size:1.6rem;display:none;align-items:center;justify-content:center;cursor:pointer;transform:translateY(-50%);backdrop-filter:blur(4px);transition:background .2s}
.nav-btn:hover,.nav-btn:active{background:rgba(74,144,217,.5);border-color:var(--sky)}
#navL{left:6px}
#navR{right:6px}
.nav-btn.vis{display:flex}

/* Clear city button */
.hb-clear{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}

/* City full modal */
#cityFullModal{position:fixed;inset:0;z-index:62;display:none;align-items:center;justify-content:center;background:rgba(10,22,40,.7);backdrop-filter:blur(6px)}
#cityFullModal.show{display:flex}
.cfm-inner{background:linear-gradient(135deg,#0a1628,#1a2a4a);border:3px solid var(--yellow);border-radius:24px;padding:1.5rem 2rem;text-align:center;max-width:380px;width:90%;box-shadow:0 0 50px rgba(255,217,61,.3)}
.cfm-emoji{font-size:3.5rem}
.cfm-title{font-family:'Boogaloo',cursive;font-size:1.6rem;color:var(--yellow);margin:.4rem 0}
.cfm-text{color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:1rem}
.cfm-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.cfm-btn{padding:.5rem 1.2rem;border-radius:30px;border:none;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.cfm-btn-clear{background:linear-gradient(135deg,var(--coral),#ff4040);color:#fff}
.cfm-btn-keep{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}

/* ═══ QUESTION — centered box (bands 2/3) ═══ */
#qOver{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:30;display:none;flex-direction:column;align-items:center;padding:.8rem 1.2rem;background:rgba(15,37,64,.94);border:2px solid rgba(255,255,255,.15);border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:480px;width:90%}
#qOver.active{display:flex}
.qc{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;margin-top:.3rem}
.qc img{width:44px;height:44px;border-radius:50%;border:2px solid var(--yellow);background:rgba(255,255,255,.1);object-fit:cover}
.qc .cn{font-family:'Boogaloo',cursive;font-size:1.1rem;color:var(--yellow)}
.qt{font-size:.95rem;color:#fff;line-height:1.4;margin-bottom:.6rem;font-weight:700;text-align:center;max-width:560px}
.qog{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;max-width:600px;margin-bottom:.3rem}
.qb{padding:.6rem 1.2rem;border-radius:30px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;transition:all .2s;min-width:120px;text-align:center}
.qb:hover{background:rgba(74,144,217,.25);border-color:var(--sky);transform:translateY(-2px)}
.qb.ok{border-color:var(--green);background:rgba(78,203,113,.3)}.qb.no{border-color:var(--coral);background:rgba(255,92,92,.25)}
.qh{padding:.4rem .7rem;border-radius:8px;background:rgba(255,217,61,.1);border:1px solid rgba(255,217,61,.25);color:var(--yellow);font-size:.75rem;display:none;text-align:center;max-width:400px}
.qh.vis{display:block}

/* ═══ MATCH PROMPT — centered box (band 1) ═══ */
#matchOver{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:30;display:none;flex-direction:row;align-items:center;padding:.6rem 1rem;background:rgba(15,37,64,.94);border:2px solid rgba(255,255,255,.15);border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:480px;width:92%;gap:.8rem}
#matchOver.active{display:flex}
.mc-img{width:80px;height:80px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.mc-body{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;flex:1}
.mc-name{font-family:'Boogaloo',cursive;font-size:1.2rem;color:var(--yellow)}
.mt{font-size:.9rem;color:#fff;line-height:1.3;font-weight:700}
.match-status{display:flex;gap:.5rem;align-items:center;font-size:.8rem;font-weight:700}
.match-status .ms-item{display:flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:20px;border:2px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5)}
.match-status .ms-item.done{border-color:var(--green);color:var(--green);background:rgba(78,203,113,.15)}
.match-status .ms-item.needed{border-color:var(--yellow);color:var(--yellow);background:rgba(255,217,61,.1)}
@media(max-width:400px){.mc-img{width:60px;height:60px}.mc-name{font-size:1rem}.mt{font-size:.8rem}}

/* Red flash for wrong taps */
#wrongFlash{position:fixed;inset:0;z-index:35;background:rgba(255,60,60,.25);pointer-events:none;opacity:0;transition:opacity .15s}
#wrongFlash.show{opacity:1}
/* Green flash for correct taps */
#correctFlash{position:fixed;inset:0;z-index:35;background:rgba(78,203,113,.2);pointer-events:none;opacity:0;transition:opacity .2s}
#correctFlash.show{opacity:1}
/* Match celebration overlay */
.match-celeb{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:42;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s}
.match-celeb.show{opacity:1}
.match-celeb-emoji{font-size:4rem;filter:drop-shadow(0 0 20px rgba(255,215,0,.7));animation:celebPop .6s cubic-bezier(.34,1.56,.64,1) both}
.match-celeb-text{font-family:'Boogaloo',cursive;font-size:1.8rem;color:#FFD93D;text-shadow:0 0 20px rgba(255,217,61,.5);margin-top:.2rem;animation:celebPop .6s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes celebPop{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.2) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* Level-up overlay — exact match maths-dive */
.level-up-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,22,40,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s ease}
.level-up-overlay.show{opacity:1;pointer-events:auto}
.level-up-inner{display:flex;flex-direction:column;align-items:center;gap:.4rem;animation:lvlPop .5s cubic-bezier(.34,1.56,.64,1) both}
.level-up-emoji{font-size:4rem;filter:drop-shadow(0 0 20px rgba(255,215,0,.7))}
.level-up-title{font-family:'Boogaloo',cursive;font-size:2.8rem;color:#FFD93D;text-shadow:0 0 30px rgba(255,217,61,.5);letter-spacing:1px}
.level-up-text{font-size:1.15rem;font-weight:800;color:rgba(255,255,255,.85);letter-spacing:.5px}
@keyframes lvlPop{0%{transform:scale(.3) translateY(40px);opacity:0}60%{transform:scale(1.08) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0)}}

/* Band mastery overlay — exact match maths-dive */
.band-mastery-overlay{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;background:rgba(10,22,40,.75);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s ease}
.band-mastery-overlay.show{opacity:1;pointer-events:auto}
.band-mastery-inner{display:flex;flex-direction:column;align-items:center;gap:.5rem;animation:bandPop .6s cubic-bezier(.34,1.56,.64,1) both}
.band-mastery-emoji{font-size:5rem;filter:drop-shadow(0 0 24px rgba(255,217,61,.5))}
.band-mastery-title{font-family:'Boogaloo',cursive;font-size:3.2rem;color:#FFD93D;text-shadow:0 0 40px rgba(255,217,61,.5);letter-spacing:2px}
.band-mastery-text{font-size:1.3rem;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:.5px}
.band-mastery-stars{font-size:2.5rem;letter-spacing:8px;animation:starPulse 1.2s ease-in-out infinite alternate}
@keyframes bandPop{0%{transform:scale(.2) translateY(60px);opacity:0}60%{transform:scale(1.1) translateY(-8px);opacity:1}100%{transform:scale(1) translateY(0)}}
@keyframes starPulse{0%{filter:drop-shadow(0 0 6px rgba(255,217,61,.3))}100%{filter:drop-shadow(0 0 20px rgba(255,217,61,.8))}}

/* Badge toast */

  if(G.sc){
    Object.keys(bldSpr).forEach(function(k){var bs=bldSpr[k];if(bs&&bs.sprite){bs.sprite.destroy();bs.sprite=null}});
    walkers.forEach(function(w){if(w.spr)w.spr.destroy()});walkers=[];
  }
  /* Reset cp state */
  for(var k in G.cp){G.cp[k]={cor:0,bld:false,veh:false}}
  G.ul=0;updHUD();
}

}

function _restoreCity(){

  });
  (state.vehicles||[]).forEach(function(ck){

  /* Place sprites silently (no animation) */

    }

    }else{
      v=sc.add.image(sl.x+20,bottomY,vk).setScale(cfg.sx,cfg.sy).setDepth(D.vehicle);
      v._animMul=1;
      v._baseSX=cfg.sx;v._baseSY=cfg.sy;
    }
    v._charKey=ck;v._dir=1;v._sp=40+Math.random()*50;v._baseSp=v._sp;
    v._stopTimer=8000+Math.random()*10000;v._stopped=false;v._stopDur=1000+Math.random()*1500;v._elapsed=0;
    v._laneBottomY=bottomY;v._laneTopY=topY;

function recordAnswer(correct){
  if(!G.band||!G.currentGrade)return;
  G.answerHistory.push(correct);
  if(G.answerHistory.length>MASTERY_WINDOW)G.answerHistory=G.answerHistory.slice(-MASTERY_WINDOW);
  var atTop=G.playGrades.indexOf(G.currentGrade)>=G.playGrades.length-1;
  if(atTop&&!G.bandMastered){
    G.bandAnswerHistory.push(correct);
    if(G.bandAnswerHistory.length>BAND_MASTERY_WINDOW)G.bandAnswerHistory=G.bandAnswerHistory.slice(-BAND_MASTERY_WINDOW);
  }
  _saveHistories();
  updateMasteryVisual();
  checkMastery();
}

function checkMastery(){
  if(G.answerHistory.length<MASTERY_WINDOW)return;
  var cc=0;for(var i=0;i<G.answerHistory.length;i++)if(G.answerHistory[i])cc++;
  if(cc/MASTERY_WINDOW<MASTERY_THRESHOLD)return;
  var idx=G.playGrades.indexOf(G.currentGrade);
  if(idx<0)return;

  /* Top grade — can't promote further, check band mastery */
  if(idx>=G.playGrades.length-1){
    var _tb2={jk:'cb_g_jk',sk:'cb_g_sk',grade_1:'cb_g_gr1',grade_2:'cb_g_gr2',grade_3:'cb_g_gr3',grade_4:'cb_g_gr4'};
    var tid=_tb2[G.currentGrade];
    if(tid&&_award(tid)){_toast(tid);G.newBadges.push(tid)}
    if(!G.bandMastered)checkBandMastery();
    G.answerHistory=[];
    return;
  }
  /* Promote to next grade */
  var nextGrade=G.playGrades[idx+1];
  if(!G.poolsByGrade[nextGrade]||G.poolsByGrade[nextGrade].length===0){
    /* band 1 has no text pools — allow promotion anyway */
    if(!G.isMatch)return;
  }
  var prevGrade=G.currentGrade;
  G.currentGrade=nextGrade;
  G.answerHistory=[];
  var progress=_loadProgress();
  var bp=progress[G.band]||{mastered_grades:[]};
  if(!bp.mastered_grades)bp.mastered_grades=[];
  if(bp.mastered_grades.indexOf(prevGrade)===-1)bp.mastered_grades.push(prevGrade);
  _saveProgress(G.band,G.currentGrade,bp.mastered_grades);
  var _gm2={jk:'cb_g_jk',sk:'cb_g_sk',grade_1:'cb_g_gr1',grade_2:'cb_g_gr2',grade_3:'cb_g_gr3',grade_4:'cb_g_gr4'};
  var gmid=_gm2[prevGrade];
  if(gmid&&_award(gmid)){_toast(gmid);G.newBadges.push(gmid)}
  if(!G.isMatch)buildActivePool();
  /* Update SK matching requirement in real-time */
  if(G.isMatch)G.needVehicle=(G.currentGrade==='sk');
  renderGradeSelector();updateMasteryVisual();showLevelUp(prevGrade,nextGrade);
}

function checkBandMastery(){
  if(G.bandMastered)return;
  if(G.bandAnswerHistory.length<BAND_MASTERY_WINDOW)return;
  var c=0;for(var i=0;i<G.bandAnswerHistory.length;i++)if(G.bandAnswerHistory[i])c++;
  if(c<BAND_MASTERY_REQUIRED)return;
  G.bandMastered=true;G.bandAnswerHistory=[];
  var _bb={band_1:'cb_band_1',band_2:'cb_band_2',band_3:'cb_band_3'};
  var bbid=_bb[G.band];
  if(bbid&&_award(bbid)){_toast(bbid);G.newBadges.push(bbid)}
  var progress=_loadProgress();
  var bp=progress[G.band]||{mastered_grades:[]};
  bp.band_mastered=true;
  _saveProgress(G.band,G.currentGrade,bp.mastered_grades||[]);
  updateMasteryVisual();renderGradeSelector();showBandMastery();
}

function updateMasteryVisual(){
  var fill=$('masteryFill'),arc=$('masteryArc'),label=$('masteryLabel'),gradeEl=$('qbarGrade'),wrap=$('masteryWrap');
  if(!fill||!arc)return;
  /* Update grade pill */
  if(gradeEl){
    if(G.currentGrade&&GRADE_META[G.currentGrade]){
      gradeEl.textContent=GRADE_META[G.currentGrade].label;
      gradeEl.style.display='';
    }else{
      gradeEl.textContent='';gradeEl.style.display='none';
    }
    gradeEl.classList.remove('promoted');
  }
  if(!G.band||!G.currentGrade){if(wrap)wrap.style.display='none';return}
  var isTop=G.playGrades.indexOf(G.currentGrade)>=G.playGrades.length-1;
  if(isTop&&G.bandMastered){
    if(wrap)wrap.style.display='none';
    if(gradeEl){gradeEl.classList.add('promoted');gradeEl.textContent+='\u2B50'}
    return;
  }
  if(isTop&&!G.bandMastered){
    if(wrap)wrap.style.display='';
    if(gradeEl)gradeEl.classList.add('promoted');
    var bc=0;for(var i=0;i<G.bandAnswerHistory.length;i++)if(G.bandAnswerHistory[i])bc++;
    var bp=Math.min(bc/BAND_MASTERY_REQUIRED,1);
    fill.style.transform='scale('+bp+')';fill.setAttribute('class','mastery-fill band-mastery'+(bp>=1?' full':''));
    arc.style.strokeDashoffset=MASTERY_CIRCUMFERENCE*(1-bp);arc.setAttribute('class','mastery-arc band-mastery'+(bp>=1?' full':''));
    if(label)label.textContent=bp>=1?'\u2B50 MASTER':bc+'/'+BAND_MASTERY_REQUIRED;
    return;
  }
  if(wrap)wrap.style.display='';
  var cc=0;for(var j=0;j<G.answerHistory.length;j++)if(G.answerHistory[j])cc++;
  var pr=Math.min(cc/MASTERY_REQUIRED,1);
  fill.style.transform='scale('+pr+')';fill.setAttribute('class','mastery-fill'+(pr>=1?' full':''));
  arc.style.strokeDashoffset=MASTERY_CIRCUMFERENCE*(1-pr);arc.setAttribute('class','mastery-arc'+(pr>=1?' full':''));
  if(label)label.textContent=pr>=1?'\u2713 READY':cc+'/'+MASTERY_REQUIRED;
}

/* ══════════════════════════════════════════════════════════════════════════
   START GAME
   ══════════════════════════════════════════════════════════════════════════ */
function startGame(){
  if(!G.band){console.error('CB: no band set');return}
  /* Init audio context inside user gesture */
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
  G.lives=3;
  console.log('CB: startGame band='+G.band+' isMatch='+G.isMatch);
  showScr('loadScreen');
  $('lBar').style.width='5%';$('lTxt').textContent='Loading questions...';

  fetch('/data/community-builder-questions.json?v=2').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(d){
    console.log('CB: JSON loaded, sets='+(d.question_sets||[]).length+' schema='+d.schema_version);
    G.qs=d.question_sets||[];
    $('lBar').style.width='15%';

    if(G.isMatch){
      /* ── BAND 1 — visual matching, no text questions ── */
      G.playGrades=(PLAY_CHAIN[G.band]||[]).slice();
      var prog=_loadProgress(),bp=prog[G.band];
      var mast=(bp&&bp.mastered_grades)||[];
      if(urlGrade&&G.playGrades.indexOf(urlGrade)>=0){G.currentGrade=urlGrade}
      else{
        G.currentGrade=null;
        for(var i=0;i<G.playGrades.length;i++){if(mast.indexOf(G.playGrades[i])===-1){G.currentGrade=G.playGrades[i];break}}
        if(!G.currentGrade)G.currentGrade=G.playGrades[G.playGrades.length-1]||'jk';
        G.bandMastered=!!(bp&&bp.band_mastered);
        if(bp&&Array.isArray(bp.answer_history))G.answerHistory=bp.answer_history;
        if(bp&&Array.isArray(bp.band_answer_history))G.bandAnswerHistory=bp.band_answer_history;
      }
      G.needVehicle=(G.currentGrade==='sk');
      G.matchChars=shuf(MATCHABLE.slice()).slice(0,CHARS_PER_ROUND);
      G.matchIdx=0;
      /* Band 1 poolsByGrade stays empty — grade promotion works without pools */
      G.poolsByGrade={jk:[{fake:true}],sk:[{fake:true}]};
      $('prT').textContent=String(CHARS_PER_ROUND);
      renderGradeSelector();
      console.log('CB: band1 ready, grade='+G.currentGrade+' matchChars='+G.matchChars.length);

    }else{
      /* ── BANDS 2/3 — text question flow ── */
      var grades=BAND_GRADES[G.band]||[];
      G.poolsByGrade={};
      grades.forEach(function(g){G.poolsByGrade[g]=[]});
      /* grade_id fallback for v1 JSON without grade_id fields */
      var _gidFallback={band_1:'sk',band_2:'grade_1',band_3:'grade_3'};
      G.qs.forEach(function(s){
        if(s.band_id!==G.band)return;
        var gid=s.grade_id||_gidFallback[s.band_id]||null;
        if(!gid)return;
        if(!G.poolsByGrade[gid])G.poolsByGrade[gid]=[];
        s.questions.forEach(function(q){
          G.poolsByGrade[gid].push({question:q.question,options:q.options,correct:q.correct,hint:q.hint,character:s.character});
        });
      });
      /* Cross-band warmup — only load if pool is still empty (v2 JSON puts warm-up in target band) */
      var xb=CROSS_BAND[G.band];
      if(xb&&(!G.poolsByGrade[xb.prevGrade]||G.poolsByGrade[xb.prevGrade].length===0)){
        G.poolsByGrade[xb.prevGrade]=[];
        G.qs.forEach(function(s){
          if(s.band_id!==xb.prevBand)return;
          var gid2=s.grade_id||_gidFallback[s.band_id]||null;
          if(gid2!==xb.prevGrade)return;
          s.questions.forEach(function(q){
            G.poolsByGrade[xb.prevGrade].push({question:q.question,options:q.options,correct:q.correct,hint:q.hint,character:s.character});
          });
        });
      }
      var chain=PLAY_CHAIN[G.band]||[];
      G.playGrades=[];chain.forEach(function(g){if((G.poolsByGrade[g]||[]).length>0)G.playGrades.push(g)});
      var prog2=_loadProgress(),bp2=prog2[G.band];
      var mast2=(bp2&&bp2.mastered_grades)||[];
      if(urlGrade&&G.playGrades.indexOf(urlGrade)>=0){G.currentGrade=urlGrade}
      else{
        G.currentGrade=null;
        for(var j=0;j<G.playGrades.length;j++){if(mast2.indexOf(G.playGrades[j])===-1){G.currentGrade=G.playGrades[j];break}}
        if(!G.currentGrade)G.currentGrade=G.playGrades[G.playGrades.length-1]||null;
        G.bandMastered=!!(bp2&&bp2.band_mastered);
        if(bp2&&Array.isArray(bp2.answer_history))G.answerHistory=bp2.answer_history;
        if(bp2&&Array.isArray(bp2.band_answer_history))G.bandAnswerHistory=bp2.band_answer_history;
      }
      buildActivePool();

      /* Build fully randomized queue */
      CHARS.forEach(function(c){G.cp[c]={cor:0,bld:false,veh:false}});
      var gradeQs=G.poolsByGrade[G.currentGrade]||[];
      G.queue=shuf(gradeQs.slice()).slice(0,10);
      $('prT').textContent='10';
      renderGradeSelector();
      console.log('CB: band'+G.bn+' ready, grade='+G.currentGrade+' playGrades='+G.playGrades+' queue='+G.queue.length);
    }

    console.log('CB: booting Phaser');
    $('lBar').style.width='20%';$('lTxt').textContent='Loading town...';
    bootPhaser();
  }).catch(function(e){console.error('CB: fetch/init error',e);$('lTxt').textContent='Error: '+e.message});
}

function phaserPreload(){
  var self=this;

function phaserCreate(){

  /* BG layer 1 */
  var bg1=['bg-building_large_background_1','bg-building_medium_background_1','bg-building_small_background_1','bg-house_large_background_1','bg-house_medium_background_1','bg-warehouse_background_1'];
  for(var bi2=0;bi2<10;bi2++){var k1=bg1[bi2%bg1.length];if(sc.textures.exists(k1))sc.add.image(250+bi2*350+Math.random()*80,RY-20,k1).setScale(.38+Math.random()*.08).setOrigin(.5,1).setDepth(D.bgBuild1).setScrollFactor(.65)}
  var tb1=['tbg-tree_01_background_1','tbg-tree_02_background_1'];
  for(var ti2=0;ti2<8;ti2++){var t1=tb1[ti2%tb1.length];if(sc.textures.exists(t1))sc.add.image(200+ti2*440+Math.random()*100,RY,t1).setScale(.4+Math.random()*.1).setOrigin(.5,1).setDepth(D.bgTree1).setScrollFactor(.7)}

  /* FG trees/bushes/weeds */
  [100,390,770,1150,1530,1910,2290,2670,3050,3400].forEach(function(tx,i){

    if(sc.textures.exists(k))sc.add.image(tx+Math.random()*40-20,RY+25,k).setScale(.4+Math.random()*.12).setOrigin(.5,1).setDepth(D.tree);

  for(var wi=0;wi<20;wi++){var wk='t-weeds_0'+(wi%3+1);if(sc.textures.exists(wk))sc.add.image(wi*185+Math.random()*60,RY+26+Math.random()*4,wk).setScale(.3+Math.random()*.15).setOrigin(.5,1).setDepth(D.tree)}
  for(var bsi=0;bsi<6;bsi++){var bsk='t-bush_0'+(bsi%2+1);if(sc.textures.exists(bsk))sc.add.image(300+bsi*600+Math.random()*100,RY+26,bsk).setScale(.35+Math.random()*.1).setOrigin(.5,1).setDepth(D.tree)}

  /* Ground */
  var gfx=sc.add.graphics().setDepth(D.ground);

  gfx.fillStyle(0x4a8e3b);gfx.fillRect(0,RY+20,WW,8);
  gfx.fillStyle(0xccbbaa);gfx.fillRect(0,RY+28,WW,10);
  gfx.fillStyle(0x555555);gfx.fillRect(0,RY+38,WW,GH-RY-38);
  gfx.fillStyle(0xffdd44);for(var rx=0;rx<WW;rx+=55)gfx.fillRect(rx,RY+56,28,3);

  /* ═══ BUILD SCENE OBJECTS ═══ */
  Object.keys(SL).forEach(function(ck){bldSpr[ck]={ghost:null,sprite:null}});

  if(G.isMatch){
    /* Band 1: pre-place ALL buildings */
    Object.keys(SL).forEach(function(ck){
      var sl=SL[ck],bk='b-'+CI[ck].b;
      if(!bk||!sc.textures.exists(bk))return;
      var b=sc.add.image(sl.x,RY+28,bk).setScale(sl.s).setOrigin(.5,1).setDepth(D.building);
      bldSpr[ck].sprite=b;
    });
    /* Wrench sign on mechanic's warehouse */
    if(sc.textures.exists('p-sign_wrench')){
      var msl=SL.mechanic;
      sc.add.image(msl.x,RY+28-msl.s*200-40,  'p-sign_wrench').setScale(.12).setOrigin(.5,.5).setDepth(D.building+0.5);
    }
    /* All props pre-placed */
    CP.forEach(function(p){var pk='p-'+p.k;if(sc.textures.exists(pk))sc.add.image(p.x,RY+28,pk).setScale(p.s).setOrigin(.5,1).setDepth(D.prop)});
    /* All vehicles driving on road — two-lane system */
    Object.keys(VM).forEach(function(ck){
      var vn=VM[ck];
      var vk='v-'+vn;
      var hasAnim=sc.textures.exists('va-'+vn)&&sc.anims.exists(vn+'-da');
      if(!hasAnim&&!sc.textures.exists(vk))return;
      var sl=SL[ck]||{x:600};
      var cfg=VEH_CFG[vn]||{sx:0.22,sy:0.18,by:0,ty:0};
      var bottomY=LANE_BOTTOM_Y+cfg.by;
      var topY=LANE_TOP_Y+cfg.ty;
      var v;
      if(hasAnim){
        /* Compute scale multiplier: static image is bigger than 384x384 frame */
        var staticTex=sc.textures.exists(vk)?sc.textures.get(vk).getSourceImage():null;
        var animMul=staticTex?(staticTex.width/384*2):2;
        v=sc.add.sprite(sl.x+20,bottomY,'va-'+vn).setScale(cfg.sx*animMul,cfg.sy*animMul).setDepth(D.vehicle);
        v.play(vn+'-da');
        v._animMul=animMul;
      }else{
        v=sc.add.image(sl.x+20,bottomY,vk).setScale(cfg.sx,cfg.sy).setDepth(D.vehicle);
        v._animMul=1;
      }
      v._charKey=ck;v._dir=1;v._sp=40+Math.random()*50;v._baseSp=v._sp;
      v._stopTimer=8000+Math.random()*10000;v._stopped=false;v._stopDur=1000+Math.random()*1500;v._elapsed=0;
      v._laneBottomY=bottomY;v._laneTopY=topY;
      v._baseSX=cfg.sx*(hasAnim&&staticTex?animMul:1);v._baseSY=cfg.sy*(hasAnim&&staticTex?animMul:1);
      v.setFlipX(false);
      vehSpr[ck]=v;
    });
  }else{
    /* Bands 2/3: empty slots — then restore saved city */
    CP.forEach(function(){propSpr.push({ghost:null,sprite:null})});
    _restoreCity();
  }

  /* Camera target */
  G.camTarget=sc.add.rectangle(WW/2,WALKY,4,4,0x000000,0).setDepth(0);
  G.camTarget.x=300;
  sc.cameras.main.startFollow(G.camTarget,true,0.06,0.06,0,40);

  /* Band 1: drag-to-pan (only when match overlay not showing a tap target) */
  if(G.isMatch){
    var dragSt=null;
    sc.input.on('pointerdown',function(p){dragSt={x:p.x,camX:G.camTarget.x}});
    sc.input.on('pointermove',function(p){
      if(!dragSt||!p.isDown)return;
      var dx=p.x-dragSt.x;
      G.camTarget.x=Phaser.Math.Clamp(dragSt.camX-dx/sc.cameras.main.zoom,0,WW);
    });
    sc.input.on('pointerup',function(){dragSt=null});
  }

  /* Ready */
  console.log('CB: phaserCreate done, launching game');
  $('lBar').style.width='100%';$('lTxt').textContent='Ready!';
  setTimeout(function(){
    showScr(null);$('gameWrap').classList.add('active');$('hud').classList.add('active');
    if(!G.isMatch)$('clearCityBtn').style.display='';
    if(typeof CrabcakeAvatar!=='undefined')CrabcakeAvatar.refreshHUD();
    updateMasteryVisual();
    setTimeout(G.isMatch?nextMatch:nextQ,800);
  },400);
  }catch(err){console.error('CB: phaserCreate error',err);$('lTxt').textContent='Scene error: '+err.message}
}

function phaserUpdate(time,delta){
  clouds.forEach(function(cl){cl.x+=cl._sp*(delta/1000);if(cl.x>WW+200)cl.x=-200});
  walkers.forEach(function(w){if(!w.spr||!w.spr.active||w._tw)return;w.spr.x+=w.dir*w.sp*(delta/1000);w.spr.setFlipX(w.dir<0);if(w.spr.x>w.mx)w.dir=-1;if(w.spr.x<w.mn)w.dir=1});
  /* Patrol intro sprite (bands 2/3) */
  if(G.introSpr&&G.introSpr.active&&!G.entering){
    var s=G.introSpr;
    s.x+=G.patrolDir*G.patrolSpeed*(delta/1000);
    s.setFlipX(G.patrolDir<0);
    if(s.x>WW-60)G.patrolDir=-1;if(s.x<60)G.patrolDir=1;
    if(!G.isMatch)G.camTarget.x+=(s.x-G.camTarget.x)*0.08;
  }
  /* Vehicle driving — two-lane natural traffic (all bands) */
  var vKeys=Object.keys(vehSpr);
  if(vKeys.length>0){
    /* Reset all speeds toward base each frame (gradual restore) */
    vKeys.forEach(function(ck){
      var v=vehSpr[ck];if(!v||!v.active)return;
      if(v._sp<v._baseSp)v._sp+=(v._baseSp-v._sp)*0.02;
    });
    vKeys.forEach(function(ck){
      var v=vehSpr[ck];if(!v||!v.active)return;
      v._elapsed+=delta;
      if(v._stopped){
        if(v._elapsed>=v._stopDur){v._stopped=false;v._elapsed=0;v._stopTimer=8000+Math.random()*10000}
      }else{
        v.x+=v._dir*v._sp*(delta/1000);
        /* Hit right edge → switch to top lane */
        if(v.x>WW-60&&v._dir===1){
          v._dir=-1;v.setFlipX(true);
          v.y=v._laneTopY;v.setDepth(D.vehicle-0.5);
          v.setScale(v._baseSX*0.85,v._baseSY*0.85);
        }
        /* Hit left edge → switch to bottom lane */
        if(v.x<60&&v._dir===-1){
          v._dir=1;v.setFlipX(false);
          v.y=v._laneBottomY;v.setDepth(D.vehicle);
          v.setScale(v._baseSX,v._baseSY);
        }
        if(v._elapsed>=v._stopTimer){v._stopped=true;v._elapsed=0;v._stopDur=1000+Math.random()*1500}
      }
    });
    /* Same-lane spacing: if too close, the trailing vehicle slows down (never below 40% base) */
    for(var vi=0;vi<vKeys.length;vi++){
      var va=vehSpr[vKeys[vi]];if(!va||!va.active)continue;
      for(var vj=vi+1;vj<vKeys.length;vj++){
        var vb=vehSpr[vKeys[vj]];if(!vb||!vb.active)continue;
        if(va._dir!==vb._dir)continue;
        var hw=va.displayWidth*0.5+vb.displayWidth*0.5+60;
        var dist=Math.abs(va.x-vb.x);
        if(dist<hw){
          /* Nudge apart gently */
          var nudge=(hw-dist)*0.3;
          if(va._dir===1){
            /* L→R: trailing = smaller x */
            if(va.x<vb.x){va.x-=nudge;va._sp=Math.max(va._baseSp*0.4,vb._sp*0.7)}
            else{vb.x-=nudge;vb._sp=Math.max(vb._baseSp*0.4,va._sp*0.7)}
          }else{
            /* R→L: trailing = larger x */
            if(va.x>vb.x){va.x+=nudge;va._sp=Math.max(va._baseSp*0.4,vb._sp*0.7)}
            else{vb.x+=nudge;vb._sp=Math.max(vb._baseSp*0.4,va._sp*0.7)}
          }
        }
      }
    }
  }
  /* Nav button hold-scroll */
  if(_navHold&&G.camTarget){
    G.camTarget.x=Phaser.Math.Clamp(G.camTarget.x+_navHold*_navSpeed*(delta/1000),0,WW);
  }
}

function nextMatch(){
  console.log('CB: nextMatch idx='+G.matchIdx+'/'+G.matchChars.length);
  if(G.matchIdx>=G.matchChars.length){finish();return}
  var ck=G.matchChars[G.matchIdx];
  var isSK=(G.currentGrade==='sk');
  G.matchBldDone=false;G.matchVehDone=false;

  var c=CI[ck];
  $('mImg').style.display='';$('mImg').src=AP+'/sprites/static/'+ck+'.png';
  $('mNm').textContent=c.e+' '+c.n;

  if(isSK){
    $('mTx').textContent='Find their building and vehicle!';
    var stH='<span class="ms-item needed" id="msBld">\u{1F3E0} Building</span>';
    stH+='<span class="ms-item needed" id="msVeh">\u{1F697} Vehicle</span>';
    $('mSt').innerHTML=stH;
  }else{
    /* JK: find building OR vehicle */
    $('mTx').textContent=c.v?'Find their building or vehicle!':'Find their building!';
    var stH2='<span class="ms-item needed" id="msBld">\u{1F3E0} Building</span>';
    if(c.v)stH2+='<span class="ms-item needed" id="msVeh">\u{1F697} Vehicle</span>';
    $('mSt').innerHTML=stH2;
  }
  $('matchOver').classList.add('active');

  /* Make buildings tappable — pixelPerfect to avoid overlapping hitboxes */
  var sc=G.sc;
  Object.keys(bldSpr).forEach(function(k){
    var bs=bldSpr[k];if(!bs||!bs.sprite)return;
    bs.sprite.setInteractive({useHandCursor:true,pixelPerfect:true,alphaTolerance:100});
    bs.sprite.off('pointerdown');
    bs.sprite.on('pointerdown',function(ptr,lx,ly,ev){ev.stopPropagation();handleBldTap(k,ck)});
  });
  /* Make vehicles tappable — pixelPerfect */
  Object.keys(vehSpr).forEach(function(k){
    var vs=vehSpr[k];if(!vs||!vs.active)return;
    vs.setInteractive({useHandCursor:true,pixelPerfect:true,alphaTolerance:100});
    vs.off('pointerdown');
    vs.on('pointerdown',function(ptr,lx,ly,ev){ev.stopPropagation();handleVehTap(k,ck)});
  });
}

function handleBldTap(tapped,target){
  if(G.matchBldDone)return;
  G.ans++;
  if(tapped===target){
    G.matchBldDone=true;G.corr++;
    playSound('correct');correctFlash();
    var el=$('msBld');if(el)el.className='ms-item done';
    var bs=bldSpr[tapped];if(bs&&bs.sprite){G.sc.tweens.add({targets:bs.sprite,scaleX:bs.sprite.scaleX*1.12,scaleY:bs.sprite.scaleY*.92,yoyo:true,duration:300,ease:'Bounce.easeOut'})}
    checkMatchDone(target);
  }else{wrongFlash();playSound('wrong');recordAnswer(false);loseLife()}
}
function handleVehTap(tapped,target){
  if(G.matchVehDone)return;
  G.ans++;
  if(tapped===target){
    G.matchVehDone=true;G.corr++;
    playSound('correct');correctFlash();
    var el=$('msVeh');if(el)el.className='ms-item done';
    var vs=vehSpr[tapped];if(vs)G.sc.tweens.add({targets:vs,y:vs.y-12,yoyo:true,duration:300,ease:'Bounce.easeOut'});
    checkMatchDone(target);
  }else{wrongFlash();playSound('wrong');recordAnswer(false);loseLife()}
}
function checkMatchDone(target){
  var isSK=(G.currentGrade==='sk');
  if(isSK){
    if(!G.matchBldDone||!G.matchVehDone){
      /* Partial match on SK — play a partial chime but keep going */
      if(G.matchBldDone||G.matchVehDone)playSound('partial');
      return;
    }
  }else{
    if(!G.matchBldDone&&!G.matchVehDone)return;
  }
  recordAnswer(true);G.score+=10;G.ul++;G.matchIdx++;updHUD();
  /* Disable interactives */
  Object.keys(bldSpr).forEach(function(k){var bs=bldSpr[k];if(bs&&bs.sprite)bs.sprite.disableInteractive()});
  Object.keys(vehSpr).forEach(function(k){var vs=vehSpr[k];if(vs&&vs.active)vs.disableInteractive()});
  /* Pan to matched building */
  var sl=SL[target];if(sl)panTo(sl.x);
  $('matchOver').classList.remove('active');
  /* Big celebration */
  playSound('matchComplete');
  doConfetti();doConfetti();
  var c=CI[target];
  showMatchCeleb(c?c.e:'⭐',c?c.n+' found!':'Match!');
  /* Spawn character walking near their building */
  setTimeout(function(){spWalk(target);playSound('spawn')},800);
  setTimeout(nextMatch,3000);
}
function wrongFlash(){var f=$('wrongFlash');f.classList.add('show');setTimeout(function(){f.classList.remove('show')},250)}
function correctFlash(){var f=$('correctFlash');f.classList.add('show');setTimeout(function(){f.classList.remove('show')},300)}
function showMatchCeleb(emoji,text){
  var el=$('matchCeleb'),em=$('mcEm'),tx=$('mcTx');

  em.textContent=emoji;tx.textContent=text;
  el.classList.add('show');

}

/* ══════════════════════════════════════════════════════════════════════════
   AUDIO ENGINE
   ══════════════════════════════════════════════════════════════════════════ */
var audioCtx=null;
var _soundOn=true;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playSound(type){
  if(!_soundOn)return;
  try{
    var ac=getAudio();
    if(ac.state==='suspended')ac.resume();
    if(type==='correct'){
      var osc=ac.createOscillator();var gain=ac.createGain();
      osc.connect(gain);gain.connect(ac.destination);
      osc.frequency.setValueAtTime(523,ac.currentTime);
      osc.frequency.setValueAtTime(659,ac.currentTime+.1);
      osc.frequency.setValueAtTime(784,ac.currentTime+.2);
      gain.gain.setValueAtTime(.15,ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);
      osc.start(ac.currentTime);osc.stop(ac.currentTime+.4);
    }else if(type==='wrong'){
      var osc2=ac.createOscillator();var gain2=ac.createGain();
      osc2.connect(gain2);gain2.connect(ac.destination);
      osc2.type='sawtooth';
      osc2.frequency.setValueAtTime(200,ac.currentTime);
      osc2.frequency.setValueAtTime(150,ac.currentTime+.1);
      gain2.gain.setValueAtTime(.1,ac.currentTime);
      gain2.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
      osc2.start(ac.currentTime);osc2.stop(ac.currentTime+.25);
    }else if(type==='partial'){
      var osc3=ac.createOscillator();var gain3=ac.createGain();
      osc3.connect(gain3);gain3.connect(ac.destination);
      osc3.type='triangle';
      osc3.frequency.setValueAtTime(440,ac.currentTime);
      osc3.frequency.setValueAtTime(554,ac.currentTime+.12);
      gain3.gain.setValueAtTime(.12,ac.currentTime);
      gain3.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);
      osc3.start(ac.currentTime);osc3.stop(ac.currentTime+.3);
    }else if(type==='matchComplete'){
      [523,659,784,1047].forEach(function(freq,i){
        var o=ac.createOscillator();var g=ac.createGain();
        o.connect(g);g.connect(ac.destination);o.type='triangle';
        o.frequency.setValueAtTime(freq,ac.currentTime+i*.12);
        g.gain.setValueAtTime(.12,ac.currentTime+i*.12);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.12+.4);
        o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.4);
      });
    }else if(type==='spawn'){
      var osc4=ac.createOscillator();var gain4=ac.createGain();
      osc4.connect(gain4);gain4.connect(ac.destination);
      osc4.type='triangle';
      osc4.frequency.setValueAtTime(392,ac.currentTime);
      osc4.frequency.setValueAtTime(523,ac.currentTime+.15);
      gain4.gain.setValueAtTime(.1,ac.currentTime);
      gain4.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);
      osc4.start(ac.currentTime);osc4.stop(ac.currentTime+.35);
    }else if(type==='levelUp'){
      [523,659,784,988,1047,1319].forEach(function(freq,i){
        var o=ac.createOscillator();var g=ac.createGain();
        o.connect(g);g.connect(ac.destination);o.type='triangle';
        o.frequency.setValueAtTime(freq,ac.currentTime+i*.15);
        g.gain.setValueAtTime(.15,ac.currentTime+i*.15);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.15+.5);
        o.start(ac.currentTime+i*.15);o.stop(ac.currentTime+i*.15+.5);
      });
    }
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   BANDS 2/3: TEXT QUESTION FLOW
   ══════════════════════════════════════════════════════════════════════════ */
function nextQ(){
  console.log('CB: nextQ queue='+G.queue.length);
  if(!G.queue.length){dismissIntro(function(){finish()});return}
  if(G.lives<=0)return;
  var q=G.queue.shift();
  if(!q){dismissIntro(function(){finish()});return}
  var p=G.cp[q.character];
  /* First time seeing this character and not already in city → walk-in intro */
  if(p&&p.cor===0&&!p.bld){
    if(q.character===G.curChar){showQ(q);return}
    if(G.curChar){dismissIntro(function(){charIntro(q.character,function(){showQ(q)})})}
    else{charIntro(q.character,function(){showQ(q)})}
  }else{
    /* Returning character — dismiss any active intro sprite first */
    if(G.introSpr||G.curChar){
      dismissIntro(function(){
        var ck=q.character;
        var sl=SL[ck];
        if(sl){
          var hasWalker=false;
          for(var wi=0;wi<walkers.length;wi++){if(walkers[wi].spr&&walkers[wi].spr._charKey===ck&&walkers[wi].spr.active){hasWalker=true;break}}
          if(!hasWalker)spWalk(ck);
          panTo(sl.x);
        }
        setTimeout(function(){showQ(q)},600);
      });
    }else{
      var ck=q.character;
      var sl=SL[ck];
      if(sl){
        var hasWalker=false;
        for(var wi=0;wi<walkers.length;wi++){if(walkers[wi].spr&&walkers[wi].spr._charKey===ck&&walkers[wi].spr.active){hasWalker=true;break}}
        if(!hasWalker)spWalk(ck);
        panTo(sl.x);
      }
      setTimeout(function(){showQ(q)},600);
    }
  }
}

function showQ(q){
  var c=CI[q.character]||{n:q.character,e:'?'};
  $('qImg').style.display='';$('qImg').src=AP+'/sprites/static/'+q.character+'.png';
  $('qNm').textContent=c.e+' '+c.n;
  $('qTx').textContent=q.question;
  $('qHi').classList.remove('vis');$('qHi').textContent=q.hint||'';
  var g=$('qOp');g.innerHTML='';
  /* Randomize answer positions */
  var indices=[];for(var i=0;i<q.options.length;i++)indices.push(i);
  shuf(indices);
  indices.forEach(function(origIdx){
    var b=document.createElement('button');b.className='qb';b.textContent=q.options[origIdx];
    var isCorrect=(origIdx===q.correct);
    b.addEventListener('click',function(){ansH(isCorrect,q,b,g)});g.appendChild(b);
  });
  $('qOver').classList.add('active');
}

function ansH(isCorrect,q,btn,opWrap){
  opWrap.querySelectorAll('.qb').forEach(function(b){b.style.pointerEvents='none'});
  G.ans++;
  if(isCorrect){
    btn.classList.add('ok');G.corr++;G.score+=10;
    playSound('correct');correctFlash();
    recordAnswer(true);
    var p=G.cp[q.character];p.cor++;updHUD();
    if(p.cor===1&&!p.bld){
      /* First correct → drop building + convert intro sprite to walker at building */
      p.bld=true;G.ul++;
      setTimeout(function(){
        $('qOver').classList.remove('active');
        var ck=q.character;
        var sl=SL[ck];
        /* Pan camera to building slot immediately */
        if(sl)panTo(sl.x);
        /* Convert intro sprite to permanent walker — walk at natural speed */
        if(G.introSpr&&G.curChar===ck){
          var spr=G.introSpr;
          spr.setDepth(D.walker);spr._charKey=ck;
          if(sl){
            var dist=Math.abs(spr.x-sl.x);
            var walkSpeed=30; /* px/s — natural walking pace */
            var walkDur=Math.max((dist/walkSpeed)*1000,800);
            spr.setFlipX(spr.x>sl.x);
            /* Add to walkers immediately so duplicate checks work during tween */
            var wE={spr:spr,sp:15+Math.random()*12,dir:1,mn:Math.max(sl.x-80,10),mx:Math.min(sl.x+80,WW-10),_tw:true};
            walkers.push(wE);
            G.sc.tweens.add({targets:spr,x:sl.x,duration:walkDur,ease:'Linear',onComplete:function(){
              spr.setFlipX(false);wE._tw=false;
            }});
          }else{
            spr._charKey=ck;
            var cx=spr.x;
            walkers.push({spr:spr,sp:15+Math.random()*12,dir:G.patrolDir,mn:Math.max(cx-150,10),mx:Math.min(cx+150,WW-10)});
          }
          G.introSpr=null;G.curChar=null;G.entering=false;
        }else{
          spWalk(ck);
        }
        if(ck==='construction'){
          for(var i=0;i<2&&G.pi<CP.length;i++,G.pi++)plProp(G.pi);
          doConfetti();playSound('matchComplete');_saveCityState();
        }else if(SL[ck]){
          panTo(SL[ck].x);
          setTimeout(function(){plBld(ck);doConfetti();playSound('matchComplete');_saveCityState();_checkCityFull()},1200);
        }
        updHUD();
        setTimeout(nextQ,3500);
      },700);
    }else if(p.cor===2&&!p.veh){
      /* Second correct → spawn driving vehicle on the road */
      p.veh=true;
      setTimeout(function(){
        $('qOver').classList.remove('active');
        var ck=q.character;
        if(SL[ck])panTo(SL[ck].x);
        setTimeout(function(){
          spDriveVeh(ck);
          doConfetti();playSound('matchComplete');_saveCityState();_checkCityFull();
          var ci=CI[ck];
          showMatchCeleb(ci?ci.e:'\u2B50',ci?ci.n+'\'s vehicle is on the road!':'Vehicle added!');
        },1200);
        updHUD();
        setTimeout(nextQ,3500);
      },700);
    }else{
      /* 3rd+ correct — just continue */
      setTimeout(function(){$('qOver').classList.remove('active');setTimeout(nextQ,500)},700);
    }
  }else{
    btn.classList.add('no');$('qHi').classList.add('vis');
    playSound('wrong');
    recordAnswer(false);
    loseLife();
    /* Show correct answer */
    opWrap.querySelectorAll('.qb').forEach(function(b2){
      if(!b2.classList.contains('no')&&!b2.classList.contains('ok')){
        /* Find the correct one by checking text against correct option */
        if(b2.textContent===q.options[q.correct])setTimeout(function(){b2.classList.add('ok')},400);
      }
    });
    if(G.lives>0)setTimeout(function(){$('qOver').classList.remove('active');setTimeout(nextQ,500)},2000);
  }
}

function plBld(ck){
  var sc=G.sc;if(!sc)return;var sl=SL[ck];if(!sl)return;
  var bk='b-'+CI[ck].b;if(!sc.textures.exists(bk))return;
  if(bldSpr[ck]&&bldSpr[ck].ghost){bldSpr[ck].ghost.destroy();bldSpr[ck].ghost=null}
  var b=sc.add.image(sl.x,-400,bk).setScale(sl.s).setOrigin(.5,1).setDepth(D.building);
  sc.tweens.add({targets:b,y:RY+28,duration:900,ease:'Bounce.easeOut',onComplete:function(){
    sc.tweens.add({targets:b,scaleX:sl.s*1.06,scaleY:sl.s*.95,yoyo:true,duration:200});
    /* Add wrench sign on mechanic's warehouse */
    if(ck==='mechanic'&&sc.textures.exists('p-sign_wrench')){
      sc.add.image(sl.x,RY+28-sl.s*200-40,'p-sign_wrench').setScale(.12).setOrigin(.5,.5).setDepth(D.building+0.5);
    }
  }});
  bldSpr[ck].sprite=b;
}
function plVeh(ck){
  var sc=G.sc;if(!sc)return;var vn=VM[ck];
  var hasAnim=sc.textures.exists('va-'+vn)&&sc.anims.exists(vn+'-da');
  if(!hasAnim&&!sc.textures.exists('v-'+vn))return;
  var sl=SL[ck];
  var cfg=VEH_CFG[vn]||{sx:0.22,sy:0.18};
  var sx=cfg.sx*1.18;var sy=cfg.sy*1.18;
  if(hasAnim){
    var staticTex=sc.textures.exists('v-'+vn)?sc.textures.get('v-'+vn).getSourceImage():null;
    var mul=staticTex?(staticTex.width/384*2):2;
    sx*=mul;sy*=mul;
  }
  var vy=(ck==='teacher')?WALKY+10:WALKY-2;
  var v;
  if(hasAnim){
    v=sc.add.sprite(sl.x+60,vy,'va-'+vn).setScale(sx,sy).setAlpha(0).setDepth(D.vehicle);
    v.play(vn+'-da');
  }else{
    v=sc.add.image(sl.x+60,vy,'v-'+vn).setScale(sx,sy).setAlpha(0).setDepth(D.vehicle);
  }
  sc.tweens.add({targets:v,alpha:1,x:sl.x+20,duration:600,ease:'Power2'});
}
/* Spawn a driving vehicle (bands 2/3) — same config as band 1 road vehicles */
function spDriveVeh(ck){
  var sc=G.sc;if(!sc)return;var vn=VM[ck];if(!vn)return;
  var vk='v-'+vn;
  var hasAnim=sc.textures.exists('va-'+vn)&&sc.anims.exists(vn+'-da');
  if(!hasAnim&&!sc.textures.exists(vk))return;
  var sl=SL[ck]||{x:600};
  var cfg=VEH_CFG[vn]||{sx:0.22,sy:0.18,by:0,ty:0};
  var bottomY=LANE_BOTTOM_Y+cfg.by;
  var topY=LANE_TOP_Y+cfg.ty;
  var v;
  if(hasAnim){
    var staticTex=sc.textures.exists(vk)?sc.textures.get(vk).getSourceImage():null;
    var animMul=staticTex?(staticTex.width/384*2):2;
    v=sc.add.sprite(sl.x+20,bottomY,'va-'+vn).setScale(cfg.sx*animMul,cfg.sy*animMul).setDepth(D.vehicle).setAlpha(0);
    v.play(vn+'-da');
    v._animMul=animMul;
    v._baseSX=cfg.sx*animMul;v._baseSY=cfg.sy*animMul;
  }else{
    v=sc.add.image(sl.x+20,bottomY,vk).setScale(cfg.sx,cfg.sy).setDepth(D.vehicle).setAlpha(0);
    v._animMul=1;
    v._baseSX=cfg.sx;v._baseSY=cfg.sy;
  }
  v._charKey=ck;v._dir=1;v._sp=40+Math.random()*50;v._baseSp=v._sp;
  v._stopTimer=8000+Math.random()*10000;v._stopped=false;v._stopDur=1000+Math.random()*1500;v._elapsed=0;
  v._laneBottomY=bottomY;v._laneTopY=topY;
  v.setFlipX(false);
  sc.tweens.add({targets:v,alpha:1,duration:600,ease:'Power2'});
  vehSpr[ck]=v;
}
function plProp(idx){
  if(idx>=CP.length)return;var sc=G.sc;if(!sc)return;
  var p=CP[idx],pk='p-'+p.k;if(!sc.textures.exists(pk))return;
  if(propSpr[idx]&&propSpr[idx].ghost){propSpr[idx].ghost.destroy();propSpr[idx].ghost=null}
  var spr=sc.add.image(p.x,RY+28,pk).setScale(0).setOrigin(.5,1).setAlpha(0).setDepth(D.prop);
  sc.tweens.add({targets:spr,alpha:1,scaleX:p.s,scaleY:p.s,duration:500,ease:'Back.easeOut'});
}
function spWalk(ck){
  var sc=G.sc;if(!sc||!sc.textures.exists(ck+'-walk')||!sc.anims.exists(ck+'-wa'))return;
  /* Prevent duplicates */
  for(var wi=0;wi<walkers.length;wi++){if(walkers[wi].spr&&walkers[wi].spr._charKey===ck&&walkers[wi].spr.active)return}
  var sl=SL[ck]||{x:600};
  var spr=sc.add.sprite(sl.x,WALKY,ck+'-walk').setScale(.33).setOrigin(.5,1).setDepth(D.walker);spr.play(ck+'-wa');
  spr._charKey=ck;
  walkers.push({spr:spr,sp:15+Math.random()*12,dir:Math.random()>.5?1:-1,mn:Math.max(sl.x-80,10),mx:Math.min(sl.x+80,WW-10)});
}

function charIntro(ck,cb){
  var sc=G.sc;
  if(!sc||(!sc.textures.exists(ck+'-walk')&&!sc.textures.exists(ck+'-idle'))){if(cb)cb();return}
  G.curChar=ck;
  var useW=sc.textures.exists(ck+'-walk')&&sc.anims.exists(ck+'-wa');
  G.camTarget.x=0;
  var spr=sc.add.sprite(-50,WALKY,useW?(ck+'-walk'):(ck+'-idle')).setScale(.33).setOrigin(.5,1).setDepth(D.charIntro);
  if(useW)spr.play(ck+'-wa');else if(sc.anims.exists(ck+'-ia'))spr.play(ck+'-ia');
  G.introSpr=spr;G.patrolDir=1;G.entering=true;spr.setFlipX(false);
  sc.tweens.add({targets:spr,x:200,duration:2500,ease:'Linear',onComplete:function(){G.entering=false;G.camTarget.x=spr.x;if(cb)cb()}});
}
function dismissIntro(cb){
  var ck=G.curChar;
  G.curChar=null;G.entering=false;
  if(G.introSpr){
    var spr=G.introSpr;
    var p=ck?G.cp[ck]:null;
    /* Check if walker already exists for this character */
    var hasW=false;
    if(ck){for(var wi=0;wi<walkers.length;wi++){if(walkers[wi].spr&&walkers[wi].spr._charKey===ck&&walkers[wi].spr.active){hasW=true;break}}}
    if(hasW){
      /* Walker already exists — just destroy intro sprite */
      spr.destroy();
    }else if(p&&p.bld&&SL[ck]){
      /* Character has a building — place walker at it */
      var sl=SL[ck];
      spr.setDepth(D.walker);spr.x=sl.x;spr._charKey=ck;
      walkers.push({spr:spr,sp:15+Math.random()*12,dir:1,mn:Math.max(sl.x-80,10),mx:Math.min(sl.x+80,WW-10)});
    }else{
      /* No building yet — remove sprite */
      spr.destroy();
    }
    G.introSpr=null;
  }
  if(cb)setTimeout(cb,500);
}

/* ── DRAG & DROP (bands 2/3) ── */
/* ══════════════════════════════════════════════════════════════════════════
   CONFETTI
   ══════════════════════════════════════════════════════════════════════════ */
function doConfetti(){var cs=['#FFD93D','#FF5C5C','#4ECB71','#A66CFF','#4A90D9','#FF9040'];for(var i=0;i<25;i++){var d=document.createElement('div');var t=1+Math.random()*1.5;d.style.cssText='position:fixed;width:8px;height:8px;border-radius:'+(Math.random()>.5?'50%':'2px')+';background:'+cs[Math.floor(Math.random()*cs.length)]+';left:'+Math.random()*100+'%;top:-8px;opacity:1;pointer-events:none;z-index:41;animation:cfall '+t+'s ease-out '+Math.random()*.4+'s forwards';document.body.appendChild(d);(function(el,dur){setTimeout(function(){el.remove()},(dur+.5)*1000)})(d,t)}}

/* ══════════════════════════════════════════════════════════════════════════
   FINISH
   ══════════════════════════════════════════════════════════════════════════ */
function finish(){
  $('qOver').classList.remove('active');$('matchOver').classList.remove('active');$('hud').classList.remove('active');
  /* Score: correct out of answered */
  var answered=Math.min(G.ans,10);
  var a=G.ans?Math.round(G.corr/G.ans*100):0;
  $('fSc').textContent='\u{1F3AF} '+G.corr+' out of '+answered+' correct'+(a>0?' ('+a+'%)':'');
  /* Town completion: count buildings (11 slots + construction), vehicles (12), walkers (12) = 35 total items */
  var bldCount=0,vehCount=0;
  for(var k in G.cp){
    if(G.cp[k].bld)bldCount++;
    if(G.cp[k].veh)vehCount++;
  }
  var townTotal=24; /* 12 buildings + 12 vehicles */
  var townPlaced=bldCount+vehCount;
  var townPct=Math.round(townPlaced/townTotal*100);
  $('fTown').textContent='\u{1F3D9}\u{FE0F} Town: '+townPct+'% complete ('+bldCount+' buildings, '+vehCount+' vehicles)';
  /* Title and emoji based on performance */
  if(G.lives<=0){
    $('fTitle').textContent='Game Over!';$('fEmoji').textContent='\u{1F625}';
  }else if(a===100){
    $('fTitle').textContent='Perfect Round!';$('fEmoji').textContent='\u{1F389}\u{1F31F}';
  }else if(a>=80){
    $('fTitle').textContent='Great Round!';$('fEmoji').textContent='\u{1F389}';
  }else{
    $('fTitle').textContent='Round Complete!';$('fEmoji').textContent='\u{1F3D8}\u{FE0F}';
  }
  /* Town name */
  var adj=['Amazing','Wonderful','Friendly','Happy','Sunny','Cozy','Busy','Peaceful'];
  var noun=['Town','Village','Neighbourhood','Community','Haven'];
  $('fTn').textContent=adj[Math.floor(Math.random()*adj.length)]+' '+noun[Math.floor(Math.random()*noun.length)];
  if(_award('cb_first')){_toast('cb_first');G.newBadges.push('cb_first')}
  if(a===100&&G.ans>=4&&_award('cb_perfect')){_toast('cb_perfect');G.newBadges.push('cb_perfect')}
  _incPlays('community');
  _renderEndBadges();
  setTimeout(function(){showScr('finishScreen')},800);
}

function _renderEndBadges(){
  var wrap=$('endBadgesWrap'),row=$('endBadgesRow');if(!wrap||!row)return;
  var all=Object.keys(_lb()).filter(function(id){return id.startsWith('cb_')});
  if(!all.length&&!G.newBadges.length){wrap.style.display='none';return}
  wrap.style.display='';row.innerHTML='';
  (all.length?all:G.newBadges).forEach(function(id){
    var b=BADGE_DEF[id];if(!b)return;
    var isNew=G.newBadges.indexOf(id)>=0;
    var coin=document.createElement('div');coin.className='badge-coin'+(isNew?' new-badge':'');
    coin.innerHTML='<div class="badge-coin-em">'+b.em+'</div><div class="badge-coin-name">'+b.name+'</div>';
    row.appendChild(coin);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   NAV SCROLL BUTTONS
   ══════════════════════════════════════════════════════════════════════════ */
var _navHold=null;
var _navSpeed=400; /* px/s when held */
function navScroll(dir){
  if(!G.sc||!G.camTarget)return;
  var zoom=G.sc.cameras.main.zoom;
  var viewW=GW/zoom;
  G.sc.tweens.add({targets:G.camTarget,x:Phaser.Math.Clamp(G.camTarget.x+dir*viewW,0,WW),duration:600,ease:'Sine.easeInOut'});
}
function navHoldStart(dir){
  _navHold=dir;
}
function navHoldStop(){
  _navHold=null;
}
/* Wire up buttons */
$('navL').addEventListener('click',function(e){e.stopPropagation();navScroll(-1)});
$('navR').addEventListener('click',function(e){e.stopPropagation();navScroll(1)});
$('navL').addEventListener('mousedown',function(e){e.stopPropagation();navHoldStart(-1)});
$('navR').addEventListener('mousedown',function(e){e.stopPropagation();navHoldStart(1)});
$('navL').addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();navHoldStart(-1)},{passive:false});
$('navR').addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();navHoldStart(1)},{passive:false});
document.addEventListener('mouseup',navHoldStop);
document.addEventListener('touchend',navHoldStop);

/* Show nav buttons when game is active */
var _origShowScr=showScr;
showScr=function(id){
  _origShowScr(id);
  var gameActive=!id;
  $('navL').classList.toggle('vis',gameActive);
  $('navR').classList.toggle('vis',gameActive);
};

showScr('startScreen');
/* Init avatar HUD widget */
if(typeof CrabcakeAvatar!=='undefined')setTimeout(function(){CrabcakeAvatar.refreshHUD()},100);
})();
