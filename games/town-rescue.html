<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Nunito';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Nunito-Bold.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Nunito-ExtraBold.woff2') format('woff2')}
@font-face{font-family:'Boogaloo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Boogaloo-Regular.woff2') format('woff2')}
:root{--bg:#1a3a5c;--sky:#4A90D9;--yellow:#FFD93D;--coral:#FF5C5C;--green:#4ECB71;--purple:#A66CFF;--teal:#00C9B1;--white:#fff}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;touch-action:manipulation;user-select:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;overflow:hidden}
.screen.hidden{display:none}
#startScreen{z-index:20;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.gi{font-size:4rem;margin-bottom:.3rem;animation:bob 3s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.gt{font-family:'Boogaloo',cursive;font-size:clamp(2.4rem,8vw,4rem);color:var(--coral);text-shadow:0 3px 12px rgba(255,92,92,.4);text-align:center;line-height:1;margin-bottom:.2rem}
.gs{color:rgba(255,255,255,.5);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.4rem}
.sbtn{margin-top:.6rem;padding:.75rem 2rem;border-radius:50px;border:none;font-family:'Boogaloo',cursive;font-size:1.2rem;cursor:pointer;background:linear-gradient(135deg,var(--coral),#ff4040);color:#fff;box-shadow:0 4px 24px rgba(255,92,92,.45)}
.sbtn:disabled{background:rgba(255,255,255,.1);box-shadow:none;color:rgba(255,255,255,.3);cursor:not-allowed}
.sbtn.active{animation:bp2 1.2s ease-in-out infinite}
@keyframes bp2{0%,100%{transform:scale(1);box-shadow:0 4px 24px rgba(255,92,92,.45)}50%{transform:scale(1.05);box-shadow:0 6px 32px rgba(255,92,92,.75)}}
#bandDisplay{margin:.6rem 0 .6rem;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem}
.bpill{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.4rem;border-radius:50px;font-size:1.05rem;font-weight:800;border:2px solid}
.bpill.b1{color:#FFD93D;border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.12)}
.bpill.b2{color:#00C9B1;border-color:rgba(0,201,177,.5);background:rgba(0,201,177,.12)}
.bpill.b3{color:#A66CFF;border-color:rgba(166,108,255,.5);background:rgba(166,108,255,.12)}
.bsn{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35)}
/* Start screen home button */
.hud-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:.3rem .7rem;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;text-decoration:none}
.hud-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.hud-btn:active{transform:translateY(0)}
.hud-btn-icon{font-size:1.2rem;line-height:1}
.hud-btn-label{font-size:.5rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.start-home-btn{position:absolute;top:1rem;left:1rem;z-index:50}
@media(max-width:600px){.hud-btn{padding:.25rem .45rem;border-radius:8px}.hud-btn-icon{font-size:1rem}.hud-btn-label{font-size:.38rem;letter-spacing:1px}}

/* Grade selector */
#gradeSelector{margin:.4rem 0;min-height:20px}
.grade-status{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin:.3rem 0}
.grade-next-label{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.5px}
.grade-all-done{color:#FFD93D}
.grade-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gpill{font-size:.65rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:.25rem .7rem;border-radius:20px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);cursor:default;transition:all .2s;font-family:'Nunito',sans-serif}
.gpill-done{border-color:rgba(78,203,113,.5);background:rgba(78,203,113,.1);color:#4ECB71;cursor:pointer}
.gpill-done:hover{background:rgba(78,203,113,.2);transform:translateY(-1px)}
.gpill-current{border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.12);color:#FFD93D;box-shadow:0 0 8px rgba(255,217,61,.2)}
.gpill-locked{opacity:.4}

/* Load screen */
#loadScreen{z-index:25;background:linear-gradient(180deg,#1a3a5c,#0f2540)}
.lbg{width:220px;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:1rem}
.lfill{height:100%;width:0%;border-radius:7px;background:linear-gradient(90deg,var(--coral),var(--yellow));transition:width .15s}
.ltxt{color:rgba(255,255,255,.5);font-size:.75rem;margin-top:.4rem}
#gameWrap{position:fixed;inset:0;z-index:5;display:none;background:#0a1628}
#gameWrap.active{display:block}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:15;display:none;padding:.4rem .8rem;background:linear-gradient(180deg,rgba(15,37,64,.7),transparent)}
#hud.active{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hud-left{display:flex;align-items:center;gap:.5rem}
.hb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}
.hb-sound{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.85rem}
.hs{font-family:'Boogaloo',cursive;font-size:1.1rem;color:var(--yellow)}
.hp{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:700}
.lives-display{display:flex;gap:4px;align-items:center}
.life-heart{font-size:1.4rem;transition:transform .2s,filter .2s}
.life-heart.lost{filter:grayscale(1) opacity(.3);transform:scale(.8)}
@media(max-width:600px){.life-heart{font-size:1rem}}
.hud-center{display:flex;align-items:center;justify-content:center;pointer-events:none}
#cb-avatar-hud{pointer-events:none}
@media(max-width:600px){#cb-avatar-hud svg{width:36px!important;height:36px!important}}
.hud-right{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}

/* Mastery ring */
.mastery-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.mastery-ring{width:38px;height:38px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.mastery-fill{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(0,201,177,.9),rgba(0,150,130,.7));transform:scale(0);transition:transform .5s cubic-bezier(.34,1.56,.64,1);z-index:1}
.mastery-fill.full{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,1),rgba(255,160,0,.85));box-shadow:0 0 12px rgba(255,217,61,.6)}
.mastery-ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);z-index:2}
.mastery-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
.mastery-arc{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.34,1.56,.64,1),stroke .3s}
.mastery-arc.full{stroke:var(--yellow);filter:drop-shadow(0 0 4px rgba(255,217,61,.6))}
.mastery-label{font-size:.42rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35);text-align:center;white-space:nowrap}
.mastery-fill.band-mastery{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,.9),rgba(255,160,0,.7))}
.mastery-fill.band-mastery.full{background:radial-gradient(circle at 40% 35%,rgba(255,217,61,1),rgba(255,160,0,.9));box-shadow:0 0 16px rgba(255,217,61,.7)}
.mastery-arc.band-mastery{stroke:#FFD93D}
.mastery-arc.band-mastery.full{stroke:#FFD93D;filter:drop-shadow(0 0 6px rgba(255,217,61,.8))}
/* Grade pill in HUD */
.qbar-grade{font-size:.58rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:.2rem .6rem;white-space:nowrap;flex-shrink:0;transition:color .3s,border-color .3s,background .3s}
.qbar-grade.promoted{color:var(--yellow);border-color:rgba(255,217,61,.4);background:rgba(255,217,61,.1)}
@media(max-width:600px){.qbar-grade{font-size:.48rem;padding:.15rem .45rem}.mastery-ring{width:32px;height:32px}.mastery-label{font-size:.38rem}}

/* Nav scroll buttons */
.nav-btn{position:fixed;z-index:42;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(15,37,64,.7);color:#fff;font-size:1.6rem;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s,opacity .2s}
.nav-btn:hover,.nav-btn:active{background:rgba(255,92,92,.5);border-color:var(--coral)}
#navL{left:6px}
#navR{right:6px}
.nav-btn.vis{display:flex}
@media(orientation:portrait){.nav-btn{bottom:18%;top:auto;transform:none}}
@media(orientation:landscape){.nav-btn{top:50%;transform:translateY(-50%);opacity:.5}.nav-btn:hover,.nav-btn:active{opacity:1}}

/* ═══ CRISIS CARD — top center overlay for multi-step crises ═══ */
#crisisCard{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:30;display:none;flex-direction:column;align-items:center;padding:.7rem 1.2rem;background:rgba(80,15,15,.94);border:2px solid var(--coral);border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 20px rgba(255,92,92,.2);max-width:480px;width:90%}
#crisisCard.active{display:flex}
.crisis-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.crisis-badge{font-size:1.3rem;animation:crisisPulse 1.5s ease-in-out infinite}
@keyframes crisisPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.crisis-label{font-family:'Boogaloo',cursive;font-size:1rem;color:var(--coral);letter-spacing:1px;text-transform:uppercase}
.crisis-text{font-size:.9rem;color:#fff;line-height:1.4;font-weight:700;text-align:center;max-width:420px}
.crisis-step-info{font-size:.7rem;font-weight:800;color:var(--yellow);margin-top:.4rem;padding:.2rem .6rem;background:rgba(255,217,61,.12);border:1px solid rgba(255,217,61,.25);border-radius:20px}

/* ═══ CRAB MASCOT — large character + comic speech bubble ═══ */
#crabWrap{position:fixed;z-index:40;display:none;pointer-events:none}
#crabWrap.active{display:block}
#crabWrap.pos-left{top:20%;left:-560px;transform:translateY(-50%)}
#crabWrap.pos-right{top:20%;right:-560px;transform:translateY(-50%)}
#crabWrap.enter-left{animation:crabSlideL 1.2s cubic-bezier(.22,1,.36,1) forwards}
#crabWrap.enter-right{animation:crabSlideR 1.2s cubic-bezier(.22,1,.36,1) forwards}
@keyframes crabSlideL{to{left:3%}}
@keyframes crabSlideR{to{right:3%}}
.crab-char{display:flex;align-items:center;gap:.1rem;pointer-events:auto}
.crab-char.from-right{flex-direction:row-reverse}
.crab-sprite-lg{width:275px;height:275px;flex-shrink:0;background-size:300% 300%;background-position:0 0;image-rendering:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.crab-sprite-lg.idle{background-image:url('/assets/crab-mascot/crab-animate-idle.png');animation:spritePlay 1.5s steps(1) infinite}
.crab-sprite-lg.happy{background-image:url('/assets/crab-mascot/crab-animate-happy.png');animation:spritePlay 1.2s steps(1) infinite}
.crab-sprite-lg.sad{background-image:url('/assets/crab-mascot/crab-animate-sad.png');animation:spritePlay 4s steps(1) 1}
.crab-sprite-lg.wave{background-image:url('/assets/crab-mascot/crab-animate-wave.png');animation:spritePlay 1.5s steps(1) infinite}
.crab-sprite-lg.help{background-image:url('/assets/crab-mascot/crab-animate-help.png');animation:spritePlay 2.7s steps(1) 1}
@keyframes spritePlay{
  0%{background-position:0 0}
  11.11%{background-position:-100% 0}
  22.22%{background-position:-200% 0}
  33.33%{background-position:0 -100%}
  44.44%{background-position:-100% -100%}
  55.55%{background-position:-200% -100%}
  66.66%{background-position:0 -200%}
  77.77%{background-position:-100% -200%}
  88.88%{background-position:-200% -200%}
  100%{background-position:-200% -200%}
}
.crab-bubble{position:relative;background:#fff;border-radius:60px/40px;padding:.7rem 1.3rem;width:fit-content;max-width:230px;min-width:90px;box-shadow:0 4px 20px rgba(0,0,0,.3);border:3px solid #FFD93D;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-wrap:break-word;word-wrap:break-word}
.crab-bubble.tail-left::before{content:'';position:absolute;left:-12px;top:45%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #FFD93D}
.crab-bubble.tail-left::after{content:'';position:absolute;left:-22px;top:52%;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #FFD93D}
.crab-bubble.tail-right::before{content:'';position:absolute;right:-12px;top:45%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #FFD93D}
.crab-bubble.tail-right::after{content:'';position:absolute;right:-22px;top:52%;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #FFD93D}
.crab-bubble-text{font-family:'Boogaloo',cursive;font-size:1rem;color:#1a2a44;line-height:1.35;text-align:center;max-width:100%;overflow-wrap:break-word}
.crab-bubble-hint{font-size:.75rem;color:#d4730f;font-weight:700;margin-top:.25rem;opacity:0;transition:opacity .3s;text-align:center;max-width:100%;overflow-wrap:break-word;display:none}
.cb-audio-btn{position:absolute;bottom:-10px;right:10px;background:#fff;border:2px solid #FFD93D;border-radius:50%;width:28px;height:28px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;color:#d4730f;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:1}
.cb-audio-btn:hover{background:rgba(255,217,61,.2);border-color:#FFD93D}
.cb-audio-btn.speaking{animation:audioPulse .8s ease-in-out infinite}
.cb-audio-btn.pulse{animation:audioPulse 1.5s ease-in-out infinite;border-color:#d4730f;background:rgba(255,217,61,.15)}
@keyframes audioPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* Welcome / End overlay */
#crabWelcome{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(10,22,40,.6);backdrop-filter:blur(4px);opacity:1;transition:opacity .8s ease-out}
#crabWelcome.show{display:flex}
#crabWelcome.dissolve{opacity:0}
.cw-inner{background:rgba(15,37,64,.95);border:3px solid #FFD93D;border-radius:24px;padding:1.5rem 2rem;text-align:center;max-width:420px;width:90%;animation:celebPop .5s cubic-bezier(.34,1.56,.64,1) both}
.cw-sprite{width:325px;height:325px;margin:0 auto .5rem;background:url('/assets/crab-mascot/crab-animate-wave.png');background-size:300% 300%;animation:spritePlay 1.5s steps(1) infinite}
.cw-title{font-family:'Boogaloo',cursive;font-size:1.6rem;color:#FFD93D;margin-bottom:.3rem}
.cw-text{font-size:.9rem;color:rgba(255,255,255,.7);line-height:1.4}
.cw-bubble{display:none;position:relative;background:#fff;border-radius:85px/55px;padding:1.2rem 2rem;max-width:280px;margin:0 auto 2rem;box-shadow:0 4px 20px rgba(0,0,0,.3);border:3px solid #FFD93D}
.cw-bubble::before{content:'';position:absolute;bottom:-14px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #FFD93D}
.cw-bubble::after{content:'';position:absolute;bottom:-26px;left:50%;margin-left:-4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #FFD93D}
.cw-bubble-text{font-family:'Boogaloo',cursive;font-size:1.15rem;color:#1a2a44;line-height:1.35;text-align:center}
#crabWelcome.intro .cw-inner{background:none;border:none;box-shadow:none;padding:1rem;animation:none;position:relative;overflow:visible}
#crabWelcome.intro .cw-title{display:none}
#crabWelcome.intro .cw-text{display:none}
#crabWelcome.intro .cw-sprite{transform:scale(0);animation:crabGrowIn 1s cubic-bezier(.34,1.56,.64,1) forwards,spritePlay 1.5s steps(1) infinite}
#crabWelcome.intro .cw-bubble{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.5rem}
#crabWelcome.intro .cw-bubble.pop{display:block;animation:bubblePopIn .5s cubic-bezier(.34,1.56,.64,1) both}
#crabWelcome.outro .cw-inner{background:none;border:none;box-shadow:none;padding:1rem;animation:none;position:relative;overflow:visible}
#crabWelcome.outro .cw-title{display:none}
#crabWelcome.outro .cw-text{display:none}
#crabWelcome.outro .cw-sprite{animation:celebPop .6s cubic-bezier(.34,1.56,.64,1) both,spritePlay 1.5s steps(1) infinite}
#crabWelcome.outro .cw-bubble{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.5rem}
#crabWelcome.outro .cw-bubble.pop{display:block;animation:bubblePopIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes crabGrowIn{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes bubblePopIn{0%{transform:translateX(-50%) scale(0);opacity:0}60%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
@media(max-width:400px){.crab-sprite-lg{width:190px;height:190px}.crab-bubble{max-width:190px;min-width:70px;padding:.6rem 1.1rem}.crab-bubble-text{font-size:.85rem}.cw-sprite{width:225px;height:225px}.cw-bubble{max-width:220px;padding:1rem 1.4rem}.cw-bubble-text{font-size:1rem}}

/* Red/green flash */
#wrongFlash{position:fixed;inset:0;z-index:35;background:rgba(255,60,60,.25);pointer-events:none;opacity:0;transition:opacity .15s}
#wrongFlash.show{opacity:1}
#correctFlash{position:fixed;inset:0;z-index:35;background:rgba(78,203,113,.2);pointer-events:none;opacity:0;transition:opacity .2s}
#correctFlash.show{opacity:1}
/* Celebration overlay */
.match-celeb{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:42;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s}
.match-celeb.show{opacity:1}

@keyframes bandPop{0%{transform:scale(.2) translateY(60px);opacity:0}60%{transform:scale(1.1) translateY(-8px);opacity:1}100%{transform:scale(1) translateY(0)}}

   PROGRESSION PERSISTENCE
   ══════════════════════════════════════════════════════════════════════════ */
function _loadProgress(){try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')}catch(e){return{}}}
function _saveProgress(band,grade,mastered){
  try{
    var p=_loadProgress();
    p[band]={current_grade:grade,mastered_grades:mastered||[],band_mastered:!!G.bandMastered,answer_history:G.answerHistory,band_answer_history:G.bandAnswerHistory};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));
  }catch(e){}
}
function _saveHistories(){
  if(!G.band||!G.currentGrade)return;
  try{
    var p=_loadProgress();
    if(!p[G.band])p[G.band]={current_grade:G.currentGrade,mastered_grades:[],band_mastered:false,answer_history:[],band_answer_history:[]};
    p[G.band].current_grade=G.currentGrade;
    p[G.band].answer_history=G.answerHistory;
    p[G.band].band_answer_history=G.bandAnswerHistory;
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));
  }catch(e){}
}

function recordAnswer(correct){
  if(!G.band||!G.currentGrade)return;
  G.answerHistory.push(correct);
  if(G.answerHistory.length>MASTERY_WINDOW)G.answerHistory=G.answerHistory.slice(-MASTERY_WINDOW);
  var atTop=G.playGrades.indexOf(G.currentGrade)>=G.playGrades.length-1;
  if(atTop&&!G.bandMastered){
    G.bandAnswerHistory.push(correct);
    if(G.bandAnswerHistory.length>BAND_MASTERY_WINDOW)G.bandAnswerHistory=G.bandAnswerHistory.slice(-BAND_MASTERY_WINDOW);
  }
  _saveHistories();
  updateMasteryVisual();
  checkMastery();
}

function checkMastery(){
  if(G.answerHistory.length<MASTERY_WINDOW)return;
  var cc=0;for(var i=0;i<G.answerHistory.length;i++)if(G.answerHistory[i])cc++;
  if(cc/MASTERY_WINDOW<MASTERY_THRESHOLD)return;
  var idx=G.playGrades.indexOf(G.currentGrade);
  if(idx<0)return;
  if(idx>=G.playGrades.length-1){
    var _tb2={sk:'tr_g_sk',grade_1:'tr_g_gr1',grade_2:'tr_g_gr2'};
    var tid=_tb2[G.currentGrade];
    if(tid&&_award(tid)){_toast(tid);G.newBadges.push(tid)}
    if(!G.bandMastered)checkBandMastery();
    G.answerHistory=[];
    return;
  }
  var nextGrade=G.playGrades[idx+1];
  var prevGrade=G.currentGrade;
  G.currentGrade=nextGrade;
  G.answerHistory=[];
  var progress=_loadProgress();
  var bp=progress[G.band]||{mastered_grades:[]};
  if(!bp.mastered_grades)bp.mastered_grades=[];
  if(bp.mastered_grades.indexOf(prevGrade)===-1)bp.mastered_grades.push(prevGrade);
  _saveProgress(G.band,G.currentGrade,bp.mastered_grades);
  var _gm2={sk:'tr_g_sk',grade_1:'tr_g_gr1',grade_2:'tr_g_gr2'};
  var gmid=_gm2[prevGrade];
  if(gmid&&_award(gmid)){_toast(gmid);G.newBadges.push(gmid)}
  /* Rebuild crisis pool for new grade */
  buildCrisisPool();
  renderGradeSelector();updateMasteryVisual();showLevelUp(prevGrade,nextGrade);
}

function checkBandMastery(){
  if(G.bandMastered)return;
  if(G.bandAnswerHistory.length<BAND_MASTERY_WINDOW)return;
  var c=0;for(var i=0;i<G.bandAnswerHistory.length;i++)if(G.bandAnswerHistory[i])c++;
  if(c<BAND_MASTERY_REQUIRED)return;
  G.bandMastered=true;G.bandAnswerHistory=[];
  if(_award('tr_band_2')){_toast('tr_band_2');G.newBadges.push('tr_band_2')}
  var progress=_loadProgress();
  var bp=progress[G.band]||{mastered_grades:[]};
  bp.band_mastered=true;
  _saveProgress(G.band,G.currentGrade,bp.mastered_grades||[]);
  updateMasteryVisual();renderGradeSelector();showBandMastery();
}

function updateMasteryVisual(){
  var fill=$('masteryFill'),arc=$('masteryArc'),label=$('masteryLabel'),gradeEl=$('qbarGrade'),wrap=$('masteryWrap');
  if(!fill||!arc)return;
  if(gradeEl){
    if(G.currentGrade&&GRADE_META[G.currentGrade]){gradeEl.textContent=GRADE_META[G.currentGrade].label;gradeEl.style.display=''}
    else{gradeEl.textContent='';gradeEl.style.display='none'}
    gradeEl.classList.remove('promoted');
  }
  if(!G.band||!G.currentGrade){if(wrap)wrap.style.display='none';return}
  var isTop=G.playGrades.indexOf(G.currentGrade)>=G.playGrades.length-1;
  if(isTop&&G.bandMastered){
    if(wrap)wrap.style.display='none';
    if(gradeEl){gradeEl.classList.add('promoted');gradeEl.textContent+='\u2B50'}
    return;
  }
  if(isTop&&!G.bandMastered){
    if(wrap)wrap.style.display='';
    if(gradeEl)gradeEl.classList.add('promoted');
    var bc=0;for(var i=0;i<G.bandAnswerHistory.length;i++)if(G.bandAnswerHistory[i])bc++;
    var bp=Math.min(bc/BAND_MASTERY_REQUIRED,1);
    fill.style.transform='scale('+bp+')';fill.setAttribute('class','mastery-fill band-mastery'+(bp>=1?' full':''));
    arc.style.strokeDashoffset=MASTERY_CIRCUMFERENCE*(1-bp);arc.setAttribute('class','mastery-arc band-mastery'+(bp>=1?' full':''));
    if(label)label.textContent=bp>=1?'\u2B50 MASTER':bc+'/'+BAND_MASTERY_REQUIRED;
    return;
  }
  if(wrap)wrap.style.display='';
  var cc=0;for(var j=0;j<G.answerHistory.length;j++)if(G.answerHistory[j])cc++;
  var pr=Math.min(cc/MASTERY_REQUIRED,1);
  fill.style.transform='scale('+pr+')';fill.setAttribute('class','mastery-fill'+(pr>=1?' full':''));
  arc.style.strokeDashoffset=MASTERY_CIRCUMFERENCE*(1-pr);arc.setAttribute('class','mastery-arc'+(pr>=1?' full':''));
  if(label)label.textContent=pr>=1?'\u2713 READY':cc+'/'+MASTERY_REQUIRED;
}

function renderGradeSelector(){
  var el=$('gradeSelector');
  if(!el||G.playGrades.length===0){if(el)el.innerHTML='';return}
  var mastered=((_loadProgress()[G.band]||{}).mastered_grades)||[];
  var html='<div class="grade-status">';
  var ng=null;for(var i=0;i<G.playGrades.length;i++){if(mastered.indexOf(G.playGrades[i])===-1){ng=G.playGrades[i];break}}
  if(ng)html+='<div class="grade-next-label">Next: '+GRADE_META[ng].label+'</div>';
  else html+=G.bandMastered?'<div class="grade-next-label grade-all-done">Band Mastered! \u{1F3C6}\u2B50</div>':'<div class="grade-next-label grade-all-done">Master top grade for band mastery!</div>';
  html+='<div class="grade-pills">';
  G.playGrades.forEach(function(g){
    var done=mastered.indexOf(g)>=0,cur=g===G.currentGrade;
    var cls='gpill'+(done?' gpill-done':'')+(cur?' gpill-current':'')+(!done&&!cur?' gpill-locked':'');
    var click=done?'onclick="selectStartGrade(\''+g+'\')"':'';
    html+='<button class="'+cls+'" '+click+'>'+(GRADE_META[g]?GRADE_META[g].label:g)+(done?' \u2713':'')+'</button>';
  });
  html+='</div></div>';el.innerHTML=html;
}
window.selectStartGrade=function(g){
  if(G.playGrades.indexOf(g)===-1)return;
  G.currentGrade=g;

function buildCrisisPool(){

  if(!gradeData.length)return;

/* ══════════════════════════════════════════════════════════════════════════
   START GAME
   ══════════════════════════════════════════════════════════════════════════ */
function startGame(){
  if(!G.band)return;
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
  G.lives=3;G.score=0;G.ans=0;G.corr=0;G.crisisIdx=0;G.newBadges=[];
  showScr('loadScreen');
  $('lBar').style.width='5%';$('lTxt').textContent='Loading crises...';

  fetch('/data/community-builder-questions.json?v=3').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(d){
    console.log('TR: JSON loaded');
    $('lBar').style.width='15%';

    /* Build pools by grade */
    G.poolsByGrade={};

    /* SK warmup: adapt find-and-click SK questions as single-step crises */
    var fcSK=d.find_and_click&&d.find_and_click.sk&&d.find_and_click.sk.questions;
    if(fcSK){
      G.poolsByGrade.sk=fcSK.map(function(q){
        return {id:q.id,crisis:q.question,steps:[{prompt:q.question,target:q.target}]};
      });
    }else{
      G.poolsByGrade.sk=[];
    }

    /* Grade 1: single-step crises */
    var cm=d.crisis_mode;
    if(cm&&cm.grade_1&&cm.grade_1.crises){
      G.poolsByGrade.grade_1=cm.grade_1.crises.map(function(c){
        return {id:c.id,crisis:c.crisis,steps:[{prompt:c.crisis,target:c.target}]};
      });
    }else{
      G.poolsByGrade.grade_1=[];
    }

    /* Grade 2: mixed single/multi-step */
    if(cm&&cm.grade_2&&cm.grade_2.crises){
      G.poolsByGrade.grade_2=cm.grade_2.crises.map(function(c){
        if(c.steps&&c.steps.length){
          return {id:c.id,crisis:c.crisis,steps:c.steps};
        }else{
          return {id:c.id,crisis:c.crisis,steps:[{prompt:c.crisis,target:c.target}]};
        }
      });
    }else{
      G.poolsByGrade.grade_2=[];
    }

    /* Resolve current grade from progress */
    var chain=PLAY_CHAIN[G.band]||[];
    G.playGrades=[];chain.forEach(function(g){if((G.poolsByGrade[g]||[]).length>0)G.playGrades.push(g)});
    var prog=_loadProgress(),bp=prog[G.band];
    var mast=(bp&&bp.mastered_grades)||[];
    G.currentGrade=null;
    for(var i=0;i<G.playGrades.length;i++){if(mast.indexOf(G.playGrades[i])===-1){G.currentGrade=G.playGrades[i];break}}
    if(!G.currentGrade)G.currentGrade=G.playGrades[G.playGrades.length-1]||'grade_1';
    G.bandMastered=!!(bp&&bp.band_mastered);
    if(bp&&Array.isArray(bp.answer_history))G.answerHistory=bp.answer_history;
    if(bp&&Array.isArray(bp.band_answer_history))G.bandAnswerHistory=bp.band_answer_history;

    buildCrisisPool();
    renderGradeSelector();
    console.log('TR: ready, grade='+G.currentGrade+' pool='+G.crisisPool.length);

    $('lBar').style.width='20%';$('lTxt').textContent='Loading town...';
    bootPhaser();
  }).catch(function(e){console.error('TR: fetch error',e);$('lTxt').textContent='Error: '+e.message});
}

    var spr=sc.add.sprite(sl.x,WALKY,ck+'-walk').setScale(.33).setOrigin(.5,1).setDepth(D.walker);
    spr.play(ck+'-wa');spr._charKey=ck;
    walkers.push({spr:spr,sp:15+Math.random()*12,dir:Math.random()>.5?1:-1,mn:Math.max(sl.x-80,10),mx:Math.min(sl.x+80,WW-10)});
  });

  /* ═══ PRE-PLACE ALL VEHICLES ═══ */
  Object.keys(VM).forEach(function(ck){
    var vn=VM[ck],sl=SL[ck];if(!sl)return;
    var vk='v-'+vn;
    var hasAnim=sc.textures.exists('va-'+vn)&&sc.anims.exists(vn+'-da');
    if(!hasAnim&&!sc.textures.exists(vk))return;
    var cfg=VEH_CFG[vn]||{sx:0.22,sy:0.18,by:0,ty:0};
    var bottomY=LANE_BOTTOM_Y+cfg.by,topY=LANE_TOP_Y+cfg.ty;
    var v;
    if(hasAnim){
      var staticTex=sc.textures.exists(vk)?sc.textures.get(vk).getSourceImage():null;
      var animMul=staticTex?(staticTex.width/384*2):2;
      v=sc.add.sprite(sl.x+20,bottomY,'va-'+vn).setScale(cfg.sx*animMul,cfg.sy*animMul).setDepth(D.vehicle);
      v.play(vn+'-da');v._animMul=animMul;v._baseSX=cfg.sx*animMul;v._baseSY=cfg.sy*animMul;
    }else{
      v=sc.add.image(sl.x+20,bottomY,vk).setScale(cfg.sx,cfg.sy).setDepth(D.vehicle);
      v._animMul=1;v._baseSX=cfg.sx;v._baseSY=cfg.sy;
    }
    v._charKey=ck;v._dir=1;v._sp=40+Math.random()*50;v._baseSp=v._sp;
    v._stopTimer=8000+Math.random()*10000;v._stopped=false;v._stopDur=1000+Math.random()*1500;v._elapsed=0;
    v._laneBottomY=bottomY;v._laneTopY=topY;v.setFlipX(false);
    vehSpr[ck]=v;
  });

  /* Camera target + drag-to-pan */
  G.camTarget=sc.add.rectangle(WW/2,WALKY,4,4,0x000000,0).setDepth(0);
  G.camTarget.x=300;
  sc.cameras.main.startFollow(G.camTarget,true,0.06,0.06,0,40);

  var dragSt=null;var _dragDist=0;
  sc.input.on('pointerdown',function(p){dragSt={x:p.x,y:p.y,camX:G.camTarget.x};_dragDist=0});
  sc.input.on('pointermove',function(p){
    if(!dragSt||!p.isDown)return;
    var dx=p.x-dragSt.x,dy=p.y-dragSt.y;
    _dragDist=Math.sqrt(dx*dx+dy*dy);
    G.camTarget.x=Phaser.Math.Clamp(dragSt.camX-dx/sc.cameras.main.zoom,0,WW);
  });
  sc.input.on('pointerup',function(){dragSt=null});
  G._getDragDist=function(){return _dragDist};

  /* Ready */
  console.log('TR: phaserCreate done');
  $('lBar').style.width='100%';$('lTxt').textContent='Ready!';
  setTimeout(function(){
    showScr(null);$('gameWrap').classList.add('active');$('hud').classList.add('active');
    if(typeof CrabcakeAvatar!=='undefined')CrabcakeAvatar.refreshHUD();
    updateMasteryVisual();updHUD();
    setTimeout(function(){showCrabWelcome(nextCrisis)},800);
  },400);
  }catch(err){console.error('TR: phaserCreate error',err);$('lTxt').textContent='Scene error: '+err.message}
}

function phaserUpdate(time,delta){
  clouds.forEach(function(cl){cl.x+=cl._sp*(delta/1000);if(cl.x>WW+200)cl.x=-200});
  walkers.forEach(function(w){if(!w.spr||!w.spr.active)return;w.spr.x+=w.dir*w.sp*(delta/1000);w.spr.setFlipX(w.dir<0);if(w.spr.x>w.mx)w.dir=-1;if(w.spr.x<w.mn)w.dir=1});
  /* Vehicle driving — two-lane traffic */
  var vKeys=Object.keys(vehSpr);
  if(vKeys.length>0){
    vKeys.forEach(function(ck){var v=vehSpr[ck];if(!v||!v.active)return;if(v._sp<v._baseSp)v._sp+=(v._baseSp-v._sp)*0.02});
    vKeys.forEach(function(ck){
      var v=vehSpr[ck];if(!v||!v.active)return;
      v._elapsed+=delta;
      if(v._stopped){if(v._elapsed>=v._stopDur){v._stopped=false;v._elapsed=0;v._stopTimer=8000+Math.random()*10000}}
      else{
        v.x+=v._dir*v._sp*(delta/1000);
        if(v.x>WW-60&&v._dir===1){v._dir=-1;v.setFlipX(true);v.y=v._laneTopY;v.setDepth(D.vehicle-0.5);v.setScale(v._baseSX*0.85,v._baseSY*0.85)}
        if(v.x<60&&v._dir===-1){v._dir=1;v.setFlipX(false);v.y=v._laneBottomY;v.setDepth(D.vehicle);v.setScale(v._baseSX,v._baseSY)}
        if(v._elapsed>=v._stopTimer){v._stopped=true;v._elapsed=0;v._stopDur=1000+Math.random()*1500}
      }
    });
    for(var vi=0;vi<vKeys.length;vi++){
      var va=vehSpr[vKeys[vi]];if(!va||!va.active)continue;
      for(var vj=vi+1;vj<vKeys.length;vj++){
        var vb=vehSpr[vKeys[vj]];if(!vb||!vb.active)continue;
        if(va._dir!==vb._dir)continue;
        var hw=va.displayWidth*0.5+vb.displayWidth*0.5+60;
        var dist=Math.abs(va.x-vb.x);
        if(dist<hw){
          var nudge=(hw-dist)*0.3;
          if(va._dir===1){if(va.x<vb.x){va.x-=nudge;va._sp=Math.max(va._baseSp*0.4,vb._sp*0.7)}else{vb.x-=nudge;vb._sp=Math.max(vb._baseSp*0.4,va._sp*0.7)}}
          else{if(va.x>vb.x){va.x+=nudge;va._sp=Math.max(va._baseSp*0.4,vb._sp*0.7)}else{vb.x+=nudge;vb._sp=Math.max(vb._baseSp*0.4,va._sp*0.7)}}
        }
      }
    }
  }
  if(_navHold&&G.camTarget){G.camTarget.x=Phaser.Math.Clamp(G.camTarget.x+_navHold*_navSpeed*(delta/1000),0,WW)}
}

function panTo(wx){if(G.sc&&G.camTarget)G.sc.tweens.add({targets:G.camTarget,x:wx,duration:1200,ease:'Sine.easeInOut'})}

/* ══════════════════════════════════════════════════════════════════════════
   CRISIS MODE — core game loop
   ══════════════════════════════════════════════════════════════════════════ */
function nextCrisis(){
  if(G.crisisIdx>=G.crisisPool.length||G.lives<=0){showCrabEnd();return}
  var crisis=G.crisisPool[G.crisisIdx];
  G.currentCrisis=crisis;
  G.currentStepIdx=0;
  G.crisisActive=false;

  var isMulti=crisis.steps.length>1;
  var step=crisis.steps[0];

  /* Show crisis card for multi-step */
  if(isMulti){
    $('crTx').textContent=crisis.crisis;
    $('crStep').textContent='Step 1 of '+crisis.steps.length;
    $('crisisCard').classList.add('active');
  }

  /* Crab slides in with prompt */
  setCrabExpr('idle');
  showCrab('\u2026',true);

  setTimeout(function(){
    var prompt=isMulti?step.prompt:crisis.crisis;
    showCrab(prompt);

    /* Audio mode */
    var mode=AUDIO_MODE[G.currentGrade]||'tap';
    var audioBtn=$('cbAudio');
    if(mode==='auto'){
      if(audioBtn)audioBtn.classList.remove('pulse');
      crabSpeak(prompt);
    }else{
      if(audioBtn)audioBtn.classList.add('pulse');
    }

    /* Enable taps after short delay */
    setTimeout(function(){G.crisisActive=true;enableTaps()},400);
  },1800);

  updHUD();
  console.log('TR: nextCrisis idx='+G.crisisIdx+' target='+step.target+(isMulti?' (multi '+crisis.steps.length+' steps)':''));
}

function advanceStep(){
  G.currentStepIdx++;
  var crisis=G.currentCrisis;
  if(G.currentStepIdx>=crisis.steps.length){
    /* Crisis fully solved */
    $('crisisCard').classList.remove('active');
    G.crisisIdx++;
    doConfetti();doConfetti();
    var c=CI[crisis.steps[crisis.steps.length-1].target];
    showMatchCeleb(c?c.e:'\u2B50','Crisis Resolved!');
    playSound('matchComplete');

    setTimeout(function(){hideCrab()},3000);
    setTimeout(nextCrisis,4000);
    return;
  }

  /* Show next step */
  var step=crisis.steps[G.currentStepIdx];
  $('crStep').textContent='Step '+(G.currentStepIdx+1)+' of '+crisis.steps.length;

  setCrabExpr('idle');
  showCrab(step.prompt);

  var mode=AUDIO_MODE[G.currentGrade]||'tap';
  var audioBtn=$('cbAudio');
  if(mode==='auto'){
    if(audioBtn)audioBtn.classList.remove('pulse');
    crabSpeak(step.prompt);
  }else{
    if(audioBtn)audioBtn.classList.add('pulse');
  }

  setTimeout(function(){G.crisisActive=true;enableTaps()},400);
  console.log('TR: advanceStep '+G.currentStepIdx+' target='+step.target);
}

var TAP_THRESHOLD=15;

function enableTaps(){
  var sc=G.sc;if(!sc)return;
  /* Buildings tappable */
  Object.keys(bldSpr).forEach(function(k){
    var bs=bldSpr[k];if(!bs||!bs.sprite)return;
    bs.sprite.setInteractive({useHandCursor:true,pixelPerfect:true,alphaTolerance:100});
    bs.sprite.off('pointerup');
    bs.sprite.on('pointerup',function(ptr,lx,ly,ev){
      ev.stopPropagation();
      if(G._getDragDist&&G._getDragDist()>TAP_THRESHOLD)return;
      handleTap(k);
    });
  });
  /* Walkers tappable */
  walkers.forEach(function(w){
    if(!w.spr||!w.spr.active||!w.spr._charKey)return;
    w.spr.setInteractive({useHandCursor:true,pixelPerfect:true,alphaTolerance:100});
    w.spr.off('pointerup');
    var ck=w.spr._charKey;
    w.spr.on('pointerup',function(ptr,lx,ly,ev){
      ev.stopPropagation();
      if(G._getDragDist&&G._getDragDist()>TAP_THRESHOLD)return;
      handleTap(ck);
    });
  });
}

function disableTaps(){
  Object.keys(bldSpr).forEach(function(k){var bs=bldSpr[k];if(bs&&bs.sprite)try{bs.sprite.disableInteractive()}catch(e){}});
  walkers.forEach(function(w){if(w.spr&&w.spr.active)try{w.spr.disableInteractive()}catch(e){}});
}

function handleTap(tapped){
  if(!G.crisisActive||!G.currentCrisis)return;
  if(Date.now()-_navTapBlock<300)return; /* Suppress taps from nav button bleed-through */
  var step=G.currentCrisis.steps[G.currentStepIdx];
  if(!step)return;
  G.crisisActive=false;
  disableTaps();
  G.ans++;

  if(tapped===step.target){
    /* ── CORRECT ── */
    G.corr++;G.score+=10;
    recordAnswer(true);
    playSound('correct');correctFlash();

    /* Crab celebrates */
    var praise=['Great job!','You got it!','Awesome!','That\x27s right!','Way to go!','Crisis handled!'];
    var p=praise[Math.floor(Math.random()*praise.length)];
    setCrabExpr('happy');
    showCrab(p);
    var mode=AUDIO_MODE[G.currentGrade]||'tap';
    if(mode==='auto')setTimeout(function(){crabSpeak(p)},500);

    /* Bounce the building */
    var bs=bldSpr[tapped];
    if(bs&&bs.sprite){G.sc.tweens.add({targets:bs.sprite,scaleX:bs.sprite.scaleX*1.12,scaleY:bs.sprite.scaleY*.92,yoyo:true,duration:300,ease:'Bounce.easeOut'})}
    /* Bounce walker */
    walkers.forEach(function(w){
      if(w.spr&&w.spr.active&&w.spr._charKey===tapped){
        G.sc.tweens.add({targets:w.spr,scaleX:.33*1.15,scaleY:.33*.88,yoyo:true,duration:300,ease:'Bounce.easeOut',onComplete:function(){w.spr.setScale(.33)}});
      }
    });

    /* Pan to building */
    if(SL[tapped])panTo(SL[tapped].x);

    var isMulti=G.currentCrisis.steps.length>1;
    if(isMulti&&G.currentStepIdx<G.currentCrisis.steps.length-1){
      /* More steps — celebrate briefly then advance */
      doConfetti();
      var c=CI[tapped];
      showMatchCeleb(c?c.e:'\u2B50',c?c.n+' is on it!':'Step done!');
      setTimeout(advanceStep,2500);
    }else{
      /* Single-step or final step — full celebration */
      G.crisisIdx++;
      doConfetti();doConfetti();
      var c2=CI[tapped];
      showMatchCeleb(c2?c2.e:'\u2B50','Crisis Resolved!');
      playSound('matchComplete');
      $('crisisCard').classList.remove('active');
      setTimeout(function(){hideCrab()},3000);
      updHUD();
      setTimeout(nextCrisis,4000);
    }
  }else{
    /* ── WRONG — lose life, skip entire crisis ── */
    recordAnswer(false);
    wrongFlash();playSound('wrong');

    setCrabExpr('sad');
    /* Show correct answer briefly */
    var c3=CI[step.target];
    var correctName=c3?c3.l:'the right helper';
    showCrab('That was the '+correctName+'!');
    var mode2=AUDIO_MODE[G.currentGrade]||'tap';
    if(mode2==='auto')setTimeout(function(){crabSpeak('That was the '+correctName+'!')},300);

    /* Flash the correct building */
    var bsC=bldSpr[step.target];
    if(bsC&&bsC.sprite){
      var spr=bsC.sprite;
      G.sc.tweens.add({targets:spr,alpha:0.5,yoyo:true,repeat:3,duration:300,onComplete:function(){spr.setAlpha(1)}});
      if(SL[step.target])panTo(SL[step.target].x);
    }

    $('crisisCard').classList.remove('active');
    loseLife();
    G.crisisIdx++;

    if(G.lives>0){
      setTimeout(function(){hideCrab()},2500);
      updHUD();
      setTimeout(nextCrisis,3500);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   CRAB MASCOT — inline (speech + expressions + entrances)
   ══════════════════════════════════════════════════════════════════════════ */
var _crabCurrentText='';
var _crabPos=null;
var _crabPositions=['left','right'];
var _crabPosIdx=0;

function setCrabExpr(expr){
  var spr=$('cbSprite');if(!spr)return;
  spr.className='crab-sprite-lg';spr.offsetHeight;
  spr.className='crab-sprite-lg '+expr;
}

function showCrab(text,newPos){
  var wrap=$('crabWrap');
  var charEl=$('crabChar');
  var bubble=$('crabBubbleBox');

  if(newPos||!_crabPos){
    _crabPos=_crabPositions[_crabPosIdx%_crabPositions.length];
    _crabPosIdx++;
  }

  if(wrap.classList.contains('active')&&wrap.classList.contains('enter-'+_crabPos)){
    $('cbTx').textContent=text;
    $('cbHint').textContent='';$('cbHint').classList.remove('show');
    return;
  }

  wrap.className='';
  var isRight=(_crabPos==='right');
  charEl.className='crab-char'+(isRight?' from-right':'');
  if(isRight)bubble.className='crab-bubble tail-right';
  else bubble.className='crab-bubble tail-left';

  $('cbTx').textContent=text;
  wrap.classList.add('pos-'+_crabPos);
  wrap.classList.add('active');
  wrap.offsetHeight;
  wrap.classList.add('enter-'+_crabPos);
}

function hideCrab(cb){
  var wrap=$('crabWrap');
  if(!wrap||!wrap.classList.contains('active')){if(cb)cb();return}
  wrap.style.opacity='0';wrap.style.transition='opacity .35s ease-out';
  setTimeout(function(){
    wrap.classList.remove('active','enter-'+_crabPos,'pos-'+_crabPos);
    wrap.style.opacity='';wrap.style.transition='';
    if(cb)cb();
  },380);
}

function crabSpeak(text,cb){
  _crabCurrentText=text;
  if(!_soundOn){if(cb)cb();return}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.rate=1.05;u.pitch=1.4;u.volume=0.8;
    var voices=window.speechSynthesis.getVoices();
    var pref=voices.filter(function(v){return v.lang.startsWith('en')&&/female|samantha|karen|victoria/i.test(v.name)});
    if(pref.length)u.voice=pref[0];
    else{var en=voices.filter(function(v){return v.lang.startsWith('en')});if(en.length)u.voice=en[0]}
    var btn=$('cbAudio');
    if(btn)btn.classList.add('speaking');
    u.onend=function(){if(btn){btn.classList.remove('speaking')}if(cb)cb()};
    u.onerror=function(){
      if(btn){btn.classList.remove('speaking')}
      /* If not unlocked yet, store for replay after user gesture */
      if(!_audioUnlocked){_pendingCrabSpeak={text:text,cb:cb};return}
      if(cb)cb();
    };
    window.speechSynthesis.speak(u);
  }catch(e){if(cb)cb()}
}

function crabReplay(){if(_crabCurrentText)crabSpeak(_crabCurrentText)}

/* Audio button */
document.addEventListener('DOMContentLoaded',function(){
  var ab=$('cbAudio');
  if(ab)ab.addEventListener('click',function(e){e.stopPropagation();crabReplay()});
  if(window.speechSynthesis)window.speechSynthesis.getVoices();
});

/* Preload voices */
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()}}

/* ── Mobile audio unlock — some browsers block speechSynthesis until user gesture ── */
var _audioUnlocked=false;
var _pendingCrabSpeak=null;
function _unlockAudio(){
  if(_audioUnlocked)return;
  _audioUnlocked=true;
  /* Prime Web Speech API with a silent utterance */
  try{var u=new SpeechSynthesisUtterance('');u.volume=0;window.speechSynthesis.speak(u)}catch(e){}
  /* Replay any pending speech that failed before unlock */
  if(_pendingCrabSpeak){
    var ps=_pendingCrabSpeak;_pendingCrabSpeak=null;
    crabSpeak(ps.text,ps.cb);
  }
  document.removeEventListener('touchstart',_unlockAudio,true);
  document.removeEventListener('click',_unlockAudio,true);
}
document.addEventListener('touchstart',_unlockAudio,true);
document.addEventListener('click',_unlockAudio,true);

/* Crab welcome — grow from dot */
function showCrabWelcome(cb){
  var overlay=$('crabWelcome');
  var bubble=$('cwBubble');
  overlay.classList.add('intro');
  bubble.classList.remove('pop');
  $('cwBubbleTx').textContent='The town needs help! Tap the right building or helper to fix each crisis!';
  overlay.classList.add('show');
  setTimeout(function(){
    bubble.classList.add('pop');
    crabSpeak('The town needs help! Tap the right building or helper to fix each crisis!');
  },1100);
  setTimeout(function(){
    overlay.classList.add('dissolve');
    setTimeout(function(){
      overlay.classList.remove('show','intro','dissolve');
      bubble.classList.remove('pop');overlay.style.opacity='';
      if(cb)cb();
    },850);
  },6000);
}

/* Crab end sequence */
function showCrabEnd(){
  disableTaps();hideCrab();
  $('crisisCard').classList.remove('active');
  try{window.speechSynthesis.cancel()}catch(e){}

  var pct=G.crisisPool.length?Math.round(G.corr/G.crisisPool.length*100):0;
  var msg=pct>=80?'Amazing work! The town is safe!':pct>=50?'Good job! You helped a lot of people!':'Nice try! The town still needs heroes!';

  var overlay=$('crabWelcome');
  var bubble=$('cwBubble');
  overlay.classList.add('outro');
  bubble.classList.remove('pop');

  var cwSpr=document.querySelector('.cw-sprite');
  if(cwSpr){
    if(pct>=80)cwSpr.style.backgroundImage="url('/assets/crab-mascot/crab-animate-happy.png')";
    else cwSpr.style.backgroundImage="url('/assets/crab-mascot/crab-animate-wave.png')";
  }

  $('cwBubbleTx').textContent=msg;
  overlay.classList.add('show');
  setTimeout(function(){bubble.classList.add('pop');crabSpeak(msg)},700);
  setTimeout(function(){
    overlay.classList.add('dissolve');
    setTimeout(function(){
      overlay.classList.remove('show','outro','dissolve');
      bubble.classList.remove('pop');overlay.style.opacity='';
      if(cwSpr)cwSpr.style.backgroundImage="url('/assets/crab-mascot/crab-animate-wave.png')";
      finish();
    },850);
  },5500);
}

/* ══════════════════════════════════════════════════════════════════════════
   AUDIO ENGINE
   ══════════════════════════════════════════════════════════════════════════ */
var audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playSound(type){
  if(!_soundOn)return;
  try{
    var ac=getAudio();if(ac.state==='suspended')ac.resume();
    if(type==='correct'){
      var osc=ac.createOscillator();var gain=ac.createGain();osc.connect(gain);gain.connect(ac.destination);
      osc.frequency.setValueAtTime(523,ac.currentTime);osc.frequency.setValueAtTime(659,ac.currentTime+.1);osc.frequency.setValueAtTime(784,ac.currentTime+.2);
      gain.gain.setValueAtTime(.15,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);
      osc.start(ac.currentTime);osc.stop(ac.currentTime+.4);
    }else if(type==='wrong'){
      var osc2=ac.createOscillator();var gain2=ac.createGain();osc2.connect(gain2);gain2.connect(ac.destination);osc2.type='sawtooth';
      osc2.frequency.setValueAtTime(200,ac.currentTime);osc2.frequency.setValueAtTime(150,ac.currentTime+.1);
      gain2.gain.setValueAtTime(.1,ac.currentTime);gain2.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
      osc2.start(ac.currentTime);osc2.stop(ac.currentTime+.25);
    }else if(type==='matchComplete'){
      [523,659,784,1047].forEach(function(freq,i){
        var o=ac.createOscillator();var g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';
        o.frequency.setValueAtTime(freq,ac.currentTime+i*.12);g.gain.setValueAtTime(.12,ac.currentTime+i*.12);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.12+.4);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.4);
      });
    }else if(type==='levelUp'){
      [523,659,784,988,1047,1319].forEach(function(freq,i){
        var o=ac.createOscillator();var g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';
        o.frequency.setValueAtTime(freq,ac.currentTime+i*.15);g.gain.setValueAtTime(.15,ac.currentTime+i*.15);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.15+.5);o.start(ac.currentTime+i*.15);o.stop(ac.currentTime+i*.15+.5);
      });
    }
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   UI HELPERS
   ══════════════════════════════════════════════════════════════════════════ */
function wrongFlash(){var f=$('wrongFlash');f.classList.add('show');setTimeout(function(){f.classList.remove('show')},250)}
function correctFlash(){var f=$('correctFlash');f.classList.add('show');setTimeout(function(){f.classList.remove('show')},300)}
function showMatchCeleb(emoji,text){
  var el=$('matchCeleb'),em=$('mcEm'),tx=$('mcTx');if(!el)return;
  em.textContent=emoji;tx.textContent=text;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show')},3500);
}
function doConfetti(){var cs=['#FFD93D','#FF5C5C','#4ECB71','#A66CFF','#4A90D9','#FF9040'];for(var i=0;i<25;i++){var d=document.createElement('div');var t=1+Math.random()*1.5;d.style.cssText='position:fixed;width:8px;height:8px;border-radius:'+(Math.random()>.5?'50%':'2px')+';background:'+cs[Math.floor(Math.random()*cs.length)]+';left:'+Math.random()*100+'%;top:-8px;opacity:1;pointer-events:none;z-index:41;animation:cfall '+t+'s ease-out '+Math.random()*.4+'s forwards';document.body.appendChild(d);(function(el,dur){setTimeout(function(){el.remove()},(dur+.5)*1000)})(d,t)}}

/* ══════════════════════════════════════════════════════════════════════════
   FINISH
   ══════════════════════════════════════════════════════════════════════════ */
function finish(){
  $('crisisCard').classList.remove('active');hideCrab();$('hud').classList.remove('active');
  var totalQs=G.crisisPool.length;
  var a=totalQs?Math.round(G.corr/totalQs*100):0;
  $('fSc').textContent='\u{1F3AF} '+G.corr+' out of '+totalQs+' correct'+(a>0?' ('+a+'%)':'');
  if(G.lives<=0){$('fTitle').textContent='Game Over!';$('fEmoji').textContent='\u{1F625}'}
  else if(a===100){$('fTitle').textContent='Perfect Rescue!';$('fEmoji').textContent='\u{1F389}\u{1F31F}'}
  else if(a>=80){$('fTitle').textContent='Great Rescue!';$('fEmoji').textContent='\u{1F389}'}
  else{$('fTitle').textContent='Rescue Complete!';$('fEmoji').textContent='\u{1F6A8}'}

  var adj=['Brave','Heroic','Mighty','Fearless','Bold','Daring','Swift','Gallant'];
  var noun=['Rescuers','Heroes','Responders','Champions','Protectors'];
  $('fTn').textContent=adj[Math.floor(Math.random()*adj.length)]+' '+noun[Math.floor(Math.random()*noun.length)];
  if(_award('tr_first')){_toast('tr_first');G.newBadges.push('tr_first')}
  if(a===100&&totalQs>=4&&_award('tr_perfect')){_toast('tr_perfect');G.newBadges.push('tr_perfect')}
  _incPlays('rescue');
  _renderEndBadges();
  setTimeout(function(){showScr('finishScreen')},800);
}

function _renderEndBadges(){
  var wrap=$('endBadgesWrap'),row=$('endBadgesRow');if(!wrap||!row)return;
  var all=Object.keys(_lb()).filter(function(id){return id.startsWith('tr_')});
  if(!all.length&&!G.newBadges.length){wrap.style.display='none';return}
  wrap.style.display='';row.innerHTML='';
  (all.length?all:G.newBadges).forEach(function(id){
    var b=BADGE_DEF[id];if(!b)return;
    var isNew=G.newBadges.indexOf(id)>=0;
    var coin=document.createElement('div');coin.className='badge-coin'+(isNew?' new-badge':'');
    coin.innerHTML='<div class="badge-coin-em">'+b.em+'</div><div class="badge-coin-name">'+b.name+'</div>';
    row.appendChild(coin);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   NAV SCROLL BUTTONS
   ══════════════════════════════════════════════════════════════════════════ */
var _navHold=null;var _navSpeed=400;var _navTapBlock=0;
function navScroll(dir){
  if(!G.sc||!G.camTarget)return;
  var zoom=G.sc.cameras.main.zoom;var viewW=GW/zoom;
  G.sc.tweens.add({targets:G.camTarget,x:Phaser.Math.Clamp(G.camTarget.x+dir*viewW,0,WW),duration:600,ease:'Sine.easeInOut'});
}
function navHoldStart(dir){_navHold=dir}
function navHoldStop(){_navHold=null}
$('navL').addEventListener('click',function(e){e.stopPropagation();_navTapBlock=Date.now();navScroll(-1)});
$('navR').addEventListener('click',function(e){e.stopPropagation();_navTapBlock=Date.now();navScroll(1)});
$('navL').addEventListener('mousedown',function(e){e.stopPropagation();_navTapBlock=Date.now();navHoldStart(-1)});
$('navR').addEventListener('mousedown',function(e){e.stopPropagation();_navTapBlock=Date.now();navHoldStart(1)});
var _navTouchStart=0;
$('navL').addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();_navTouchStart=Date.now();_navTapBlock=Date.now();navHoldStart(-1)},{passive:false});
$('navR').addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();_navTouchStart=Date.now();_navTapBlock=Date.now();navHoldStart(1)},{passive:false});
document.addEventListener('mouseup',navHoldStop);
document.addEventListener('touchend',function(){
  if(_navHold){_navTapBlock=Date.now();if((Date.now()-_navTouchStart)<300)navScroll(_navHold)}
  navHoldStop();
});

/* Show nav buttons when game is active */
var _origShowScr=showScr;
showScr=function(id){
  _origShowScr(id);
  var gameActive=!id;
  $('navL').classList.toggle('vis',gameActive);
  $('navR').classList.toggle('vis',gameActive);
};

showScr('startScreen');
if(typeof CrabcakeAvatar!=='undefined')setTimeout(function(){CrabcakeAvatar.refreshHUD()},100);
})();
</script>
